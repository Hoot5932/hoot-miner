    <!-- Firebase SDK Imports via CDN -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getDatabase, ref, get, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyA1QeDf1E_Kb1ZC15ahw1dY8hk3J0gXopY",
        authDomain: "thodu-65cb9.firebaseapp.com",
        databaseURL: "https://thodu-65cb9-default-rtdb.firebaseio.com",
        projectId: "thodu-65cb9",
        storageBucket: "thodu-65cb9.firebasestorage.app",
        messagingSenderId: "1070229943496",
        appId: "1:1070229943496:web:038e2e74c463e7acefa1fd",
        measurementId: "G-NF17LPGHWV"
      };

      const app = initializeApp(firebaseConfig);
      const rtdb = getDatabase(app);

      const DEFAULT_DEMO_REPO_IDS = ['repo-c-1', 'repo-c-2', 'repo-py-1', 'repo-java-1', 'repo-java-2'];
      const DEFAULT_DEMO_QUESTION_IDS = ['q-c-1', 'q-cpp-1', 'q-cpp-2', 'q-py-1', 'q-java-1', 'q-java-2'];

      window.HootDB = {
        async seedInitialDataIfNeeded() {
          try {
            for (const id of DEFAULT_DEMO_REPO_IDS) await remove(ref(rtdb, `repositories/${id}`));
            for (const qId of DEFAULT_DEMO_QUESTION_IDS) await remove(ref(rtdb, `questions_answers/${qId}`));
          } catch (err) { console.warn(err); }
        },

        async fetchRepositories() {
          try {
            const snapshot = await get(ref(rtdb, "repositories"));
            if (snapshot.exists()) return Object.values(snapshot.val()).filter(r => r && !DEFAULT_DEMO_REPO_IDS.includes(r.id));
            return [];
          } catch (err) {
            const local = localStorage.getItem("hootminer_repos");
            return local ? JSON.parse(local).filter(r => r && !DEFAULT_DEMO_REPO_IDS.includes(r.id)) : [];
          }
        },

        async fetchQuestions() {
          try {
            const snapshot = await get(ref(rtdb, "questions_answers"));
            if (snapshot.exists()) return Object.values(snapshot.val()).filter(q => q && !DEFAULT_DEMO_QUESTION_IDS.includes(q.id));
            return [];
          } catch (err) {
            const local = localStorage.getItem("hootminer_questions");
            return local ? JSON.parse(local).filter(q => q && !DEFAULT_DEMO_QUESTION_IDS.includes(q.id)) : [];
          }
        },

        async saveRepository(repo) {
          const id = repo.id || `repo-${Date.now()}`;
          const now = new Date().toISOString();
          const repoData = { ...repo, id, createdAt: repo.createdAt || now, updatedAt: now, visibility: repo.visibility || "Published" };
          try { await set(ref(rtdb, `repositories/${id}`), repoData); } catch (err) { console.warn(err); }
          const existing = await window.HootDB.fetchRepositories();
          const index = existing.findIndex((r) => r.id === id);
          if (index >= 0) existing[index] = repoData; else existing.push(repoData);
          localStorage.setItem("hootminer_repos", JSON.stringify(existing));
          return repoData;
        },

        async deleteRepository(repoId) {
          try {
            await remove(ref(rtdb, `repositories/${repoId}`));
            const allQuestions = await window.HootDB.fetchQuestions();
            const remainingQuestions = allQuestions.filter(q => q.repositoryId !== repoId);
            const qMap = {};
            remainingQuestions.forEach(q => { qMap[q.id] = q; });
            await set(ref(rtdb, "questions_answers"), qMap);
            localStorage.setItem("hootminer_questions", JSON.stringify(remainingQuestions));
          } catch (err) { console.warn(err); }
          const existing = await window.HootDB.fetchRepositories();
          const filtered = existing.filter((r) => r.id !== repoId);
          localStorage.setItem("hootminer_repos", JSON.stringify(filtered));
          return true;
        },

        async clearAllRepositories() {
          try {
            await set(ref(rtdb, "repositories"), {});
            await set(ref(rtdb, "questions_answers"), {});
          } catch (err) { console.warn(err); }
          localStorage.removeItem("hootminer_repos");
          localStorage.removeItem("hootminer_questions");
          return true;
        },

        async saveQuestion(question) {
          const id = question.id || `q-${Date.now()}`;
          const now = new Date().toISOString();
          const questionData = { ...question, id, displayOrder: Number(question.displayOrder) || 1, createdAt: question.createdAt || now };
          try { await set(ref(rtdb, `questions_answers/${id}`), questionData); } catch (err) { console.warn(err); }
          const existing = await window.HootDB.fetchQuestions();
          const index = existing.findIndex((q) => q.id === id);
          if (index >= 0) existing[index] = questionData; else existing.push(questionData);
          localStorage.setItem("hootminer_questions", JSON.stringify(existing));
          return questionData;
        },

        async deleteQuestion(questionId) {
          try { await remove(ref(rtdb, `questions_answers/${questionId}`)); } catch (err) { console.warn(err); }
          const existing = await window.HootDB.fetchQuestions();
          const filtered = existing.filter((q) => q.id !== questionId);
          localStorage.setItem("hootminer_questions", JSON.stringify(filtered));
          return true;
        },

        async fetchSubfolders() {
          try {
            const snapshot = await get(ref(rtdb, "subfolders"));
            if (snapshot.exists()) return Object.values(snapshot.val());
            return [];
          } catch (err) {
            const local = localStorage.getItem("hootminer_subfolders");
            return local ? JSON.parse(local) : [];
          }
        },

        async saveSubfolder(subfolder) {
          const id = subfolder.id || `sf-${Date.now()}`;
          const now = new Date().toISOString();
          const sfData = { ...subfolder, id, folderName: subfolder.folderName.trim(), description: subfolder.description || '', createdAt: subfolder.createdAt || now, updatedAt: now };
          try { await set(ref(rtdb, `subfolders/${id}`), sfData); } catch (err) { console.warn(err); }
          const existing = await window.HootDB.fetchSubfolders();
          const index = existing.findIndex((s) => s.id === id);
          if (index >= 0) existing[index] = sfData; else existing.push(sfData);
          localStorage.setItem("hootminer_subfolders", JSON.stringify(existing));
          return sfData;
        },

        async deleteSubfolder(subfolderId) {
          try {
            await remove(ref(rtdb, `subfolders/${subfolderId}`));
            const allQuestions = await window.HootDB.fetchQuestions();
            const remainingQuestions = allQuestions.filter(q => q.subfolderId !== subfolderId);
            const qMap = {};
            remainingQuestions.forEach(q => { qMap[q.id] = q; });
            await set(ref(rtdb, "questions_answers"), qMap);
            localStorage.setItem("hootminer_questions", JSON.stringify(remainingQuestions));
          } catch (err) { console.warn(err); }
          const existing = await window.HootDB.fetchSubfolders();
          const filtered = existing.filter((s) => s.id !== subfolderId);
          localStorage.setItem("hootminer_subfolders", JSON.stringify(filtered));
          return true;
        },

        subscribeToSubfolders(callback) {
          return onValue(ref(rtdb, "subfolders"), (snapshot) => {
            if (snapshot.exists()) callback(Object.values(snapshot.val()));
            else callback([]);
          });
        },

        // --- CONTESTS HELPERS ---
        async fetchContests() {
          try {
            const snapshot = await get(ref(rtdb, "contests"));
            if (snapshot.exists()) return Object.values(snapshot.val());
            return [];
          } catch (e) {
            const local = localStorage.getItem("hootminer_contests");
            return local ? JSON.parse(local) : [];
          }
        },

        async saveContest(contest) {
          const id = contest.id || `contest-${Date.now()}`;
          const now = new Date().toISOString();
          const data = { ...contest, id, createdAt: contest.createdAt || now, updatedAt: now, status: contest.status || "Active" };
          try { await set(ref(rtdb, `contests/${id}`), data); } catch (e) { console.warn(e); }
          const existing = await window.HootDB.fetchContests();
          const idx = existing.findIndex(c => c.id === id);
          if (idx >= 0) existing[idx] = data; else existing.push(data);
          localStorage.setItem("hootminer_contests", JSON.stringify(existing));
          return data;
        },

        async deleteContest(id) {
          try { await remove(ref(rtdb, `contests/${id}`)); } catch (e) { console.warn(e); }
          const existing = await window.HootDB.fetchContests();
          const filtered = existing.filter(c => c.id !== id);
          localStorage.setItem("hootminer_contests", JSON.stringify(filtered));
          return true;
        },

        async fetchContestApplications() {
          try {
            const snapshot = await get(ref(rtdb, "contest_applications"));
            if (snapshot.exists()) return Object.values(snapshot.val());
            return [];
          } catch (e) {
            const local = localStorage.getItem("hootminer_applications");
            return local ? JSON.parse(local) : [];
          }
        },

        async updateApplicationStatus(appId, newStatus) {
          try {
            await set(ref(rtdb, `contest_applications/${appId}/status`), newStatus);
          } catch (e) {
            console.warn("Firebase status update error:", e);
          }
          const localApps = localStorage.getItem("hootminer_applications");
          if (localApps) {
            const parsed = JSON.parse(localApps);
            const idx = parsed.findIndex(a => a.id === appId);
            if (idx >= 0) {
              parsed[idx].status = newStatus;
              localStorage.setItem("hootminer_applications", JSON.stringify(parsed));
            }
          }
          return true;
        },

        subscribeToApplications(callback) {
          return onValue(ref(rtdb, "contest_applications"), (snapshot) => {
            if (snapshot.exists()) callback(Object.values(snapshot.val()));
            else callback([]);
          });
        }
      };
      window.dispatchEvent(new Event('HootDBReady'));
    </script>

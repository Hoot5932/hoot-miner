      // Toast System
      function ToastContainer({ toasts, removeToast }) {
        return (
          <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
            {toasts.map((toast) => (
              <ToastItem key={toast.id} toast={toast} onDismiss={() => removeToast(toast.id)} />
            ))}
          </div>
        );
      }

      function ToastItem({ toast, onDismiss }) {
        useEffect(() => {
          const timer = setTimeout(() => onDismiss(), toast.duration || 3500);
          return () => clearTimeout(timer);
        }, [toast, onDismiss]);

        const borders = {
          success: 'border-emerald-500/30 bg-emerald-950/80 text-emerald-100',
          error: 'border-rose-500/30 bg-rose-950/80 text-rose-100',
          warning: 'border-amber-500/30 bg-amber-950/80 text-amber-100',
          info: 'border-cyan-500/30 bg-cyan-950/80 text-cyan-100'
        };

        return (
          <div className={`pointer-events-auto flex items-center justify-between gap-3 p-4 rounded-2xl border backdrop-blur-md shadow-xl transition-all ${borders[toast.type] || borders.info}`}>
            <div className="flex items-center gap-3">
              <Icon name={toast.type === 'success' ? 'CheckCircle2' : 'Info'} className="w-5 h-5 shrink-0" />
              <span className="text-sm font-semibold">{toast.message}</span>
            </div>
            <button onClick={onDismiss} className="text-slate-400 hover:text-slate-200 p-1 rounded-lg">
              <Icon name="X" className="w-4 h-4" />
            </button>
          </div>
        );
      }

      const ADMIN_SECURITY_HASH = '$2y$10$uojqG7bFOXjFjO9rQfoAbeZZIsYPCf064OQoPkqCiWiYoDGiyoBHi';

      // Admin Login Component with Bcrypt Hash Security Verification
      function AdminLogin({ onLoginSuccess, addToast }) {
        const [username, setUsername] = useState('');
        const [password, setPassword] = useState('');
        const [loginError, setLoginError] = useState('');
        const [loading, setLoading] = useState(false);

        const getBcrypt = () => {
          if (window.dcodeIO && window.dcodeIO.bcrypt) return window.dcodeIO.bcrypt;
          if (window.bcrypt) return window.bcrypt;
          return null;
        };

        const handleSubmit = (e) => {
          e.preventDefault();
          setLoginError('');

          const uTrim = username.trim();
          const pTrim = password.trim();

          if (!uTrim || !pTrim) {
            setLoginError('Please enter both username/email and password.');
            if (addToast) addToast('Please enter both username/email and password', 'error');
            return;
          }

          setLoading(true);

          setTimeout(() => {
            let isAuthenticated = false;
            const bcrypt = getBcrypt();
            const normalizedHash = ADMIN_SECURITY_HASH.replace(/^\$2y\$/, '$2a$');

            if (bcrypt && typeof bcrypt.compareSync === 'function') {
              try {
                // Verify entered password, username, or combination against security hash
                if (
                  bcrypt.compareSync(pTrim, normalizedHash) ||
                  bcrypt.compareSync(uTrim, normalizedHash) ||
                  bcrypt.compareSync(`${uTrim}:${pTrim}`, normalizedHash) ||
                  bcrypt.compareSync(`${uTrim}${pTrim}`, normalizedHash) ||
                  bcrypt.compareSync(`${pTrim}:${uTrim}`, normalizedHash)
                ) {
                  isAuthenticated = true;
                }
              } catch (err) {
                console.error("Bcrypt verification error:", err);
              }
            } else {
              console.warn("Bcrypt library not loaded yet, fallback check running...");
            }

            if (isAuthenticated) {
              onLoginSuccess({ email: uTrim, role: 'Administrator', loginTime: new Date().toISOString() });
              if (addToast) addToast('Authenticated successfully as Admin!', 'success');
            } else {
              setLoginError('Authentication failed. Username or password does not match security hash.');
              if (addToast) addToast('Invalid admin credentials. Security hash mismatch!', 'error');
            }
            setLoading(false);
          }, 300);
        };

        return (
          <div className="py-16 max-w-md mx-auto px-4">
            <div className="glass-panel p-8 rounded-3xl border border-slate-200 bg-white shadow-xl">
              <div className="text-center mb-8">
                <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-purple-600 to-sky-500 p-[1.5px] mx-auto mb-4 shadow-md">
                  <div className="w-full h-full bg-white rounded-[14px] flex items-center justify-center">
                    <Icon name="ShieldCheck" className="w-6 h-6 text-purple-600" />
                  </div>
                </div>
                <h2 className="text-2xl font-black text-slate-900">Admin Authentication</h2>
                <p className="text-xs text-slate-500 mt-1 font-medium">Protected system. Enter credentials matching the security hash.</p>
              </div>

              {loginError && (
                <div className="mb-5 p-4 rounded-2xl bg-rose-50 border border-rose-200 text-xs font-bold text-rose-700 flex items-start gap-2.5 shadow-sm">
                  <Icon name="AlertTriangle" className="w-4 h-4 text-rose-600 shrink-0 mt-0.5" />
                  <span>{loginError}</span>
                </div>
              )}

              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1.5">Admin Username / Email *</label>
                  <input
                    type="text"
                    required
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    placeholder="Enter Admin Username or Email"
                    className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold text-slate-900 focus:outline-none focus:border-purple-600 transition-all"
                  />
                </div>

                <div>
                  <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1.5">Admin Password *</label>
                  <input
                    type="password"
                    required
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="Enter Admin Password"
                    className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold text-slate-900 focus:outline-none focus:border-purple-600 transition-all"
                  />
                </div>

                <div className="p-3 rounded-2xl bg-purple-50 border border-purple-200 text-[11px] font-medium text-purple-900 leading-snug">
                  🔒 Protected by Bcrypt security hash verification.
                </div>

                <button
                  type="submit"
                  disabled={loading}
                  className="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-purple-600 via-pink-600 to-indigo-600 text-white font-extrabold text-sm shadow-lg hover:shadow-purple-600/30 transition-all flex items-center justify-center gap-2 cursor-pointer mt-6"
                >
                  {loading ? <span>Verifying Security Hash...</span> : <span>Authenticate & Enter Admin Portal &rarr;</span>}
                </button>
              </form>
            </div>
          </div>
        );
      }

      // Complete 3-Tier Hierarchy Manager (Repository -> Subfolders -> Q&A)
      function RepoManager({ repositories, subfolders, questions, onRefresh, addToast }) {
        const [selectedRepo, setSelectedRepo] = useState(null);
        const [selectedSubfolder, setSelectedSubfolder] = useState(null);

        // Repo modal & form
        const [isRepoModalOpen, setIsRepoModalOpen] = useState(false);
        const [editingRepo, setEditingRepo] = useState(null);
        const [repoFormData, setRepoFormData] = useState({ title: '', category: 'C / C++', description: '', visibility: 'Published' });

        // Subfolder modal & form
        const [isSubfolderModalOpen, setIsSubfolderModalOpen] = useState(false);
        const [editingSubfolder, setEditingSubfolder] = useState(null);
        const [subfolderFormData, setSubfolderFormData] = useState({ repositoryId: '', folderName: '', description: '' });

        // Question modal & form
        const [isQuestionModalOpen, setIsQuestionModalOpen] = useState(false);
        const [editingQuestion, setEditingQuestion] = useState(null);
        const [questionFormData, setQuestionFormData] = useState({
          repositoryId: '',
          subfolderId: '',
          questionTitle: '',
          language: 'c',
          codeSnippet: '',
          explanation: '',
          displayOrder: 1
        });

        // Delete confirmations
        const [deleteConfirmRepo, setDeleteConfirmRepo] = useState(null);
        const [deleteConfirmSubfolder, setDeleteConfirmSubfolder] = useState(null);
        const [deleteConfirmQuestion, setDeleteConfirmQuestion] = useState(null);

        // --- REPO HANDLERS ---
        const handleOpenCreateRepo = () => {
          setEditingRepo(null);
          setRepoFormData({ title: '', category: 'C / C++', description: '', visibility: 'Published' });
          setIsRepoModalOpen(true);
        };

        const handleOpenEditRepo = (repo) => {
          setEditingRepo(repo);
          setRepoFormData({ title: repo.title, category: repo.category || 'C / C++', description: repo.description || '', visibility: repo.visibility || 'Published' });
          setIsRepoModalOpen(true);
        };

        const handleSaveRepo = async (e) => {
          e.preventDefault();
          if (window.HootDB) {
            await window.HootDB.saveRepository({ ...editingRepo, ...repoFormData });
            addToast(editingRepo ? 'Repository updated' : 'Repository created', 'success');
            setIsRepoModalOpen(false);
            onRefresh();
          }
        };

        const handleDeleteRepo = async () => {
          if (!deleteConfirmRepo) return;
          if (window.HootDB) {
            await window.HootDB.deleteRepository(deleteConfirmRepo.id);
            addToast('Repository deleted', 'warning');
            setDeleteConfirmRepo(null);
            if (selectedRepo && selectedRepo.id === deleteConfirmRepo.id) {
              setSelectedRepo(null);
              setSelectedSubfolder(null);
            }
            onRefresh();
          }
        };

        // --- SUBFOLDER HANDLERS ---
        const handleOpenAddSubfolder = (repo) => {
          setEditingSubfolder(null);
          setSubfolderFormData({
            repositoryId: repo.id,
            folderName: '',
            description: ''
          });
          setIsSubfolderModalOpen(true);
        };

        const handleOpenEditSubfolder = (sf) => {
          setEditingSubfolder(sf);
          setSubfolderFormData({
            repositoryId: sf.repositoryId,
            folderName: sf.folderName,
            description: sf.description || ''
          });
          setIsSubfolderModalOpen(true);
        };

        const handleSaveSubfolder = async (e) => {
          e.preventDefault();
          if (!subfolderFormData.folderName.trim()) {
            addToast('Please enter a subfolder name', 'error');
            return;
          }
          if (window.HootDB) {
            await window.HootDB.saveSubfolder({ ...editingSubfolder, ...subfolderFormData });
            addToast(editingSubfolder ? 'Subfolder updated' : 'New Subfolder created', 'success');
            setIsSubfolderModalOpen(false);
            onRefresh();
          }
        };

        const handleDeleteSubfolder = async () => {
          if (!deleteConfirmSubfolder) return;
          if (window.HootDB) {
            await window.HootDB.deleteSubfolder(deleteConfirmSubfolder.id);
            addToast('Subfolder deleted', 'warning');
            setDeleteConfirmSubfolder(null);
            if (selectedSubfolder && selectedSubfolder.id === deleteConfirmSubfolder.id) {
              setSelectedSubfolder(null);
            }
            onRefresh();
          }
        };

        // --- QUESTION HANDLERS ---
        const handleOpenAddQuestion = (repo, sf) => {
          setEditingQuestion(null);
          const sfQuestions = questions.filter(q => q.subfolderId === sf.id);
          setQuestionFormData({
            repositoryId: repo.id,
            subfolderId: sf.id,
            questionTitle: '',
            language: repo.category === 'Python' ? 'python' : repo.category === 'Java' ? 'java' : 'c',
            codeSnippet: '// Write code solution here...\n',
            explanation: '',
            displayOrder: sfQuestions.length + 1
          });
          setIsQuestionModalOpen(true);
        };

        const handleOpenEditQuestion = (q) => {
          setEditingQuestion(q);
          setQuestionFormData({
            repositoryId: q.repositoryId,
            subfolderId: q.subfolderId || '',
            questionTitle: q.questionTitle,
            language: q.language || 'c',
            codeSnippet: q.codeSnippet || '',
            explanation: q.explanation || '',
            displayOrder: q.displayOrder || 1
          });
          setIsQuestionModalOpen(true);
        };

        const handleSaveQuestion = async (e) => {
          e.preventDefault();
          if (!questionFormData.questionTitle.trim() || !questionFormData.codeSnippet.trim()) {
            addToast('Please enter question title & code snippet', 'error');
            return;
          }

          if (window.HootDB) {
            await window.HootDB.saveQuestion({ ...editingQuestion, ...questionFormData });
            addToast(editingQuestion ? 'Question updated' : 'Question & Solution added to subfolder', 'success');
            setIsQuestionModalOpen(false);
            onRefresh();
          }
        };

        const handleDeleteQuestion = async () => {
          if (!deleteConfirmQuestion) return;
          if (window.HootDB) {
            await window.HootDB.deleteQuestion(deleteConfirmQuestion.id);
            addToast('Question deleted', 'warning');
            setDeleteConfirmQuestion(null);
            onRefresh();
          }
        };

        return (
          <div className="space-y-6">

            {/* Breadcrumb & Control Bar */}
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200">
              <div>
                <div className="flex items-center gap-2 text-xs font-bold text-slate-500 mb-1">
                  <button onClick={() => { setSelectedRepo(null); setSelectedSubfolder(null); }} className="hover:text-purple-600 cursor-pointer">
                    Repositories
                  </button>
                  {selectedRepo && (
                    <>
                      <span>&gt;</span>
                      <button onClick={() => setSelectedSubfolder(null)} className="hover:text-purple-600 font-bold text-slate-700 cursor-pointer">
                        {selectedRepo.title}
                      </button>
                    </>
                  )}
                  {selectedSubfolder && (
                    <>
                      <span>&gt;</span>
                      <span className="font-bold text-purple-700 font-mono">📁 {selectedSubfolder.folderName}</span>
                    </>
                  )}
                </div>

                <h3 className="text-xl font-black text-slate-900">
                  {!selectedRepo ? 'Workspace Repositories' : !selectedSubfolder ? `Subfolders in "${selectedRepo.title}"` : `Questions in "📁 ${selectedSubfolder.folderName}"`}
                </h3>
              </div>

              <div className="flex items-center gap-3">
                {selectedSubfolder ? (
                  <button
                    onClick={() => handleOpenAddQuestion(selectedRepo, selectedSubfolder)}
                    className="flex items-center gap-2 px-5 py-2.5 rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-extrabold text-xs shadow-md cursor-pointer"
                  >
                    <Icon name="Plus" className="w-4 h-4" />
                    <span>+ Add Question & Solution</span>
                  </button>
                ) : selectedRepo ? (
                  <button
                    onClick={() => handleOpenAddSubfolder(selectedRepo)}
                    className="flex items-center gap-2 px-5 py-2.5 rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-extrabold text-xs shadow-md cursor-pointer"
                  >
                    <Icon name="FolderPlus" className="w-4 h-4" />
                    <span>+ Add Subfolder</span>
                  </button>
                ) : (
                  <button
                    onClick={handleOpenCreateRepo}
                    className="flex items-center gap-2 px-5 py-2.5 rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-extrabold text-xs shadow-md cursor-pointer"
                  >
                    <Icon name="Plus" className="w-4 h-4" />
                    <span>Create Repository</span>
                  </button>
                )}
              </div>
            </div>

            {/* LEVEL 1: REPOSITORIES GRID */}
            {!selectedRepo && (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {repositories.map((repo) => {
                  const repoSubfolders = subfolders.filter(s => s.repositoryId === repo.id);
                  const repoQuestions = questions.filter(q => q.repositoryId === repo.id);

                  return (
                    <div key={repo.id} className="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm flex flex-col justify-between hover:border-purple-300 transition-all">
                      <div>
                        <div className="flex items-center justify-between mb-3">
                          <span className="text-[11px] font-extrabold px-3 py-1 bg-purple-100 text-purple-800 rounded-xl">
                            {repo.category}
                          </span>
                          <span className="text-xs font-mono font-bold text-slate-500">
                            📁 {repoSubfolders.length} Subfolders
                          </span>
                        </div>

                        <h4 className="text-lg font-bold text-slate-900 mb-2">{repo.title}</h4>
                        <p className="text-xs text-slate-600 font-medium line-clamp-3 leading-relaxed mb-4">{repo.description}</p>
                      </div>

                      <div className="pt-4 border-t border-slate-100 space-y-2">
                        <button
                          onClick={() => { setSelectedRepo(repo); setSelectedSubfolder(null); }}
                          className="w-full py-2.5 px-3 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-700 font-extrabold text-xs border border-purple-200 flex items-center justify-center gap-2 cursor-pointer shadow-sm"
                        >
                          <Icon name="Folder" className="w-4 h-4" />
                          <span>Open Subfolders ({repoSubfolders.length}) &rarr;</span>
                        </button>

                        <div className="flex items-center justify-between pt-1">
                          <span className="text-[11px] font-bold text-slate-400">Total Solutions: {repoQuestions.length}</span>
                          <div className="flex items-center gap-2">
                            <button onClick={() => handleOpenEditRepo(repo)} className="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">
                              <Icon name="Edit2" className="w-3.5 h-3.5 text-purple-600" />
                            </button>
                            <button onClick={() => setDeleteConfirmRepo(repo)} className="p-2 rounded-xl bg-rose-50 text-rose-600 hover:bg-rose-100">
                              <Icon name="Trash2" className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* LEVEL 2: SUBFOLDERS GRID INSIDE SELECTED REPO */}
            {selectedRepo && !selectedSubfolder && (
              <div className="space-y-6">
                <div className="flex items-center justify-between bg-purple-50 border border-purple-200 rounded-2xl p-4">
                  <div className="flex items-center gap-3">
                    <Icon name="Folder" className="w-6 h-6 text-purple-600" />
                    <div>
                      <h4 className="text-base font-bold text-slate-900">{selectedRepo.title}</h4>
                      <p className="text-xs text-slate-600">{selectedRepo.description}</p>
                    </div>
                  </div>

                  <button onClick={() => setSelectedRepo(null)} className="px-4 py-2 text-xs font-bold text-slate-600 bg-white border rounded-xl cursor-pointer">
                    &larr; Back to Repositories
                  </button>
                </div>

                {subfolders.filter(s => s.repositoryId === selectedRepo.id).length > 0 ? (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {subfolders.filter(s => s.repositoryId === selectedRepo.id).map((sf) => {
                      const sfQuestions = questions.filter(q => q.subfolderId === sf.id);
                      return (
                        <div key={sf.id} className="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm flex flex-col justify-between hover:border-purple-300 transition-all">
                          <div>
                            <div className="flex items-center justify-between mb-3">
                              <div className="flex items-center gap-2">
                                <Icon name="Folder" className="w-5 h-5 text-purple-600" />
                                <span className="text-xs font-bold uppercase text-purple-900">Subfolder</span>
                              </div>
                              <span className="text-xs font-mono font-bold text-purple-700 bg-purple-100 px-2.5 py-0.5 rounded-lg">
                                {sfQuestions.length} Q&A
                              </span>
                            </div>

                            <h4 className="text-lg font-extrabold text-slate-900 mb-2">{sf.folderName}</h4>
                            {sf.description && <p className="text-xs text-slate-600 line-clamp-2 mb-4">{sf.description}</p>}
                          </div>

                          <div className="pt-4 border-t border-slate-100 flex items-center justify-between">
                            <button
                              onClick={() => setSelectedSubfolder(sf)}
                              className="py-2 px-4 rounded-xl bg-purple-600 text-white font-extrabold text-xs flex items-center gap-1 cursor-pointer shadow-sm"
                            >
                              <span>Manage Q&A ({sfQuestions.length})</span>
                              <Icon name="ArrowRight" className="w-3.5 h-3.5" />
                            </button>

                            <div className="flex items-center gap-1">
                              <button onClick={() => handleOpenEditSubfolder(sf)} className="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">
                                <Icon name="Edit2" className="w-3.5 h-3.5 text-purple-600" />
                              </button>
                              <button onClick={() => setDeleteConfirmSubfolder(sf)} className="p-2 rounded-xl bg-rose-50 text-rose-600 hover:bg-rose-100">
                                <Icon name="Trash2" className="w-3.5 h-3.5" />
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                ) : (
                  <div className="p-12 text-center bg-white rounded-3xl border border-slate-200 max-w-md mx-auto shadow-sm">
                    <Icon name="FolderPlus" className="w-12 h-12 text-slate-300 mx-auto mb-3" />
                    <h4 className="text-base font-bold text-slate-800">No Subfolders Yet</h4>
                    <p className="text-xs text-slate-500 mt-1 mb-4">Create subfolders inside "{selectedRepo.title}" to categorize questions and answers.</p>
                    <button
                      onClick={() => handleOpenAddSubfolder(selectedRepo)}
                      className="px-5 py-2.5 rounded-2xl bg-purple-600 text-white text-xs font-extrabold shadow-md"
                    >
                      + Create Subfolder Now
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* LEVEL 3: QUESTIONS & ANSWERS LIST INSIDE SELECTED SUBFOLDER */}
            {selectedRepo && selectedSubfolder && (
              <div className="space-y-6">
                <div className="flex items-center justify-between bg-purple-50 border border-purple-200 rounded-2xl p-4">
                  <div className="flex items-center gap-3">
                    <Icon name="Folder" className="w-6 h-6 text-purple-600" />
                    <div>
                      <div className="text-[10px] font-extrabold uppercase text-purple-700">{selectedRepo.title}</div>
                      <h4 className="text-base font-extrabold text-slate-900">📁 {selectedSubfolder.folderName}</h4>
                    </div>
                  </div>

                  <button onClick={() => setSelectedSubfolder(null)} className="px-4 py-2 text-xs font-bold text-slate-600 bg-white border rounded-xl cursor-pointer">
                    &larr; Back to Subfolders
                  </button>
                </div>

                {questions.filter(q => q.subfolderId === selectedSubfolder.id).length > 0 ? (
                  <div className="space-y-4">
                    {questions.filter(q => q.subfolderId === selectedSubfolder.id).map((q) => (
                      <div key={q.id} className="p-5 rounded-2xl bg-white border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-sm hover:border-purple-300">
                        <div>
                          <div className="flex items-center gap-2 mb-1.5">
                            <span className="text-xs font-black text-purple-700 font-mono">#{q.displayOrder || 1}</span>
                            <h4 className="text-sm font-extrabold text-slate-900">{q.questionTitle}</h4>
                            <span className="px-2 py-0.5 rounded text-[10px] font-mono font-bold uppercase bg-purple-100 text-purple-800">{q.language}</span>
                          </div>
                          {q.explanation && <p className="text-xs text-slate-600 line-clamp-1">{q.explanation}</p>}
                        </div>

                        <div className="flex items-center gap-2 shrink-0">
                          <button onClick={() => handleOpenEditQuestion(q)} className="p-2 rounded-xl bg-purple-50 border border-purple-200 text-purple-600 hover:bg-purple-100">
                            <Icon name="Edit2" className="w-4 h-4" />
                          </button>
                          <button onClick={() => setDeleteConfirmQuestion(q)} className="p-2 rounded-xl bg-rose-50 text-rose-600 hover:bg-rose-100">
                            <Icon name="Trash2" className="w-4 h-4" />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="p-12 text-center bg-white rounded-3xl border border-slate-200 max-w-md mx-auto shadow-sm">
                    <Icon name="HelpCircle" className="w-12 h-12 text-slate-300 mx-auto mb-3" />
                    <h4 className="text-base font-bold text-slate-800">No Questions in this Subfolder</h4>
                    <p className="text-xs text-slate-500 mt-1 mb-4">Click "+ Add Question & Solution" above to add code solutions to "{selectedSubfolder.folderName}".</p>
                    <button
                      onClick={() => handleOpenAddQuestion(selectedRepo, selectedSubfolder)}
                      className="px-5 py-2.5 rounded-2xl bg-purple-600 text-white text-xs font-extrabold shadow-md"
                    >
                      + Add Question Now
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* Create / Edit Repository Modal */}
            {isRepoModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
                <div className="w-full max-w-lg bg-white rounded-3xl p-6 border shadow-2xl">
                  <h3 className="text-lg font-black mb-4">{editingRepo ? 'Edit Repository' : 'Create New Repository'}</h3>
                  <form onSubmit={handleSaveRepo} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold uppercase mb-1">Repository Title *</label>
                      <input
                        type="text"
                        required
                        value={repoFormData.title}
                        onChange={(e) => setRepoFormData({ ...repoFormData, title: e.target.value })}
                        placeholder="e.g. C Programming Problem Set"
                        className="w-full px-4 py-2.5 bg-slate-50 border rounded-2xl text-xs font-semibold"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold uppercase mb-1">Category *</label>
                      <select
                        value={repoFormData.category}
                        onChange={(e) => setRepoFormData({ ...repoFormData, category: e.target.value })}
                        className="w-full px-4 py-2.5 bg-slate-50 border rounded-2xl text-xs font-semibold"
                      >
                        <option value="C / C++">C / C++</option>
                        <option value="Python">Python</option>
                        <option value="Java">Java</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold uppercase mb-1">Description *</label>
                      <textarea
                        required
                        rows={3}
                        value={repoFormData.description}
                        onChange={(e) => setRepoFormData({ ...repoFormData, description: e.target.value })}
                        placeholder="Short overview of the problems in this repo..."
                        className="w-full px-4 py-2.5 bg-slate-50 border rounded-2xl text-xs font-medium"
                      />
                    </div>

                    <div className="flex justify-end gap-2 pt-3 border-t border-slate-200">
                      <button type="button" onClick={() => setIsRepoModalOpen(false)} className="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                      <button type="submit" className="px-5 py-2.5 bg-purple-600 text-white rounded-2xl text-xs font-extrabold shadow-md">Save Repository</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Create / Edit Subfolder Modal */}
            {isSubfolderModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
                <div className="w-full max-w-md bg-white rounded-3xl p-6 border shadow-2xl">
                  <h3 className="text-lg font-black mb-4">{editingSubfolder ? 'Edit Subfolder' : 'Create New Subfolder'}</h3>
                  <form onSubmit={handleSaveSubfolder} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold uppercase mb-1">Subfolder Name *</label>
                      <input
                        type="text"
                        required
                        value={subfolderFormData.folderName}
                        onChange={(e) => setSubfolderFormData({ ...subfolderFormData, folderName: e.target.value })}
                        placeholder="e.g. Chapter 1: Basic Arrays & Loops"
                        className="w-full px-4 py-2.5 bg-slate-50 border rounded-2xl text-xs font-semibold"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold uppercase mb-1">Subfolder Description</label>
                      <textarea
                        rows={3}
                        value={subfolderFormData.description}
                        onChange={(e) => setSubfolderFormData({ ...subfolderFormData, description: e.target.value })}
                        placeholder="Optional details about questions in this folder..."
                        className="w-full px-4 py-2.5 bg-slate-50 border rounded-2xl text-xs font-medium"
                      />
                    </div>

                    <div className="flex justify-end gap-2 pt-3 border-t border-slate-200">
                      <button type="button" onClick={() => setIsSubfolderModalOpen(false)} className="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                      <button type="submit" className="px-5 py-2.5 bg-purple-600 text-white rounded-2xl text-xs font-extrabold shadow-md">Save Subfolder</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Create / Edit Question & Answer Modal */}
            {isQuestionModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                <div className="w-full max-w-xl bg-white rounded-3xl p-6 border shadow-2xl max-h-[90vh] overflow-y-auto">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-200 mb-4">
                    <h3 className="text-lg font-black text-slate-900">
                      {editingQuestion ? 'Edit Question & Solution' : 'Add New Question & Solution'}
                    </h3>
                    <button onClick={() => setIsQuestionModalOpen(false)} className="text-slate-400 hover:text-slate-700">
                      <Icon name="X" className="w-5 h-5" />
                    </button>
                  </div>

                  <form onSubmit={handleSaveQuestion} className="space-y-4">
                    <div>
                      <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Question Title *</label>
                      <input
                        type="text"
                        required
                        value={questionFormData.questionTitle}
                        onChange={(e) => setQuestionFormData({ ...questionFormData, questionTitle: e.target.value })}
                        placeholder="e.g. Program to check if a number is Prime"
                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-semibold text-slate-900 focus:outline-none"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Programming Language *</label>
                        <select
                          value={questionFormData.language}
                          onChange={(e) => setQuestionFormData({ ...questionFormData, language: e.target.value })}
                          className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-semibold text-slate-900 focus:outline-none"
                        >
                          <option value="c">C</option>
                          <option value="cpp">C++</option>
                          <option value="python">Python</option>
                          <option value="java">Java</option>
                          <option value="javascript">JavaScript</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Display Order *</label>
                        <input
                          type="number"
                          required
                          min={1}
                          value={questionFormData.displayOrder}
                          onChange={(e) => setQuestionFormData({ ...questionFormData, displayOrder: e.target.value })}
                          className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-semibold text-slate-900 focus:outline-none"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Code Solution / Snippet *</label>
                      <textarea
                        required
                        rows={6}
                        value={questionFormData.codeSnippet}
                        onChange={(e) => setQuestionFormData({ ...questionFormData, codeSnippet: e.target.value })}
                        placeholder="#include <stdio.h>\n..."
                        className="w-full px-4 py-2.5 bg-slate-900 border border-slate-800 rounded-2xl text-xs font-mono text-cyan-200 focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Explanation / Solution Steps</label>
                      <textarea
                        rows={3}
                        value={questionFormData.explanation}
                        onChange={(e) => setQuestionFormData({ ...questionFormData, explanation: e.target.value })}
                        placeholder="Brief explanation of how the logic works..."
                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-medium text-slate-900 focus:outline-none"
                      />
                    </div>

                    <div className="pt-4 border-t border-slate-200 flex items-center justify-end gap-3">
                      <button type="button" onClick={() => setIsQuestionModalOpen(false)} className="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                      <button type="submit" className="px-5 py-2.5 rounded-2xl bg-purple-600 text-white text-xs font-extrabold shadow-md cursor-pointer">Save Question & Answer</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Delete Confirmation Modals */}
            {deleteConfirmRepo && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
                <div className="w-full max-w-md bg-white border border-rose-200 rounded-3xl p-6">
                  <h3 className="text-lg font-black text-slate-900 mb-2">Delete Repository?</h3>
                  <p className="text-xs text-slate-600 mb-4 font-medium">Are you sure you want to delete "{deleteConfirmRepo.title}" and all its subfolders & questions?</p>
                  <div className="flex items-center justify-end gap-3 pt-3 border-t border-slate-200">
                    <button onClick={() => setDeleteConfirmRepo(null)} className="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                    <button onClick={handleDeleteRepo} className="px-5 py-2.5 rounded-2xl bg-rose-600 text-white text-xs font-extrabold">Confirm Delete</button>
                  </div>
                </div>
              </div>
            )}

            {deleteConfirmSubfolder && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
                <div className="w-full max-w-md bg-white border border-rose-200 rounded-3xl p-6">
                  <h3 className="text-lg font-black text-slate-900 mb-2">Delete Subfolder?</h3>
                  <p className="text-xs text-slate-600 mb-4 font-medium">Are you sure you want to delete folder "{deleteConfirmSubfolder.folderName}" and its questions?</p>
                  <div className="flex items-center justify-end gap-3 pt-3 border-t border-slate-200">
                    <button onClick={() => setDeleteConfirmSubfolder(null)} className="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                    <button onClick={handleDeleteSubfolder} className="px-5 py-2.5 rounded-2xl bg-rose-600 text-white text-xs font-extrabold">Confirm Delete</button>
                  </div>
                </div>
              </div>
            )}

            {deleteConfirmQuestion && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
                <div className="w-full max-w-md bg-white border border-rose-200 rounded-3xl p-6">
                  <h3 className="text-lg font-black text-slate-900 mb-2">Delete Question?</h3>
                  <p className="text-xs text-slate-600 mb-4 font-medium">Are you sure you want to delete "{deleteConfirmQuestion.questionTitle}"?</p>
                  <div className="flex items-center justify-end gap-3 pt-3 border-t border-slate-200">
                    <button onClick={() => setDeleteConfirmQuestion(null)} className="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                    <button onClick={handleDeleteQuestion} className="px-5 py-2.5 rounded-2xl bg-rose-600 text-white text-xs font-extrabold">Confirm Delete</button>
                  </div>
                </div>
              </div>
            )}

          </div>
        );
      }

      // INTEGRATED LIVE TESTS & EXAM ANSWER KEYS MANAGER IN ADMIN.HTML
      function ContestsManager({ contests, applications, onRefresh, addToast }) {
        const [isModalOpen, setIsModalOpen] = useState(false);
        const [editingContest, setEditingContest] = useState(null);
        const [deleteConfirm, setDeleteConfirm] = useState(null);

        const [formData, setFormData] = useState({
          title: '',
          duration: '60 Mins',
          description: '',
          image: SAMPLE_CONTEST_IMAGES[0],
          questions: [
            { id: 'q-1', questionText: '', answerText: '' }
          ],
          status: 'Active'
        });

        const handleOpenCreate = () => {
          setEditingContest(null);
          setFormData({
            title: '',
            duration: '60 Mins',
            description: '',
            image: SAMPLE_CONTEST_IMAGES[0],
            questions: [
              { id: `q-${Date.now()}-1`, questionText: '', answerText: '' }
            ],
            status: 'Active'
          });
          setIsModalOpen(true);
        };

        const handleOpenEdit = (c) => {
          setEditingContest(c);
          const existingQuestions = Array.isArray(c.questions) && c.questions.length > 0
            ? c.questions
            : [{ id: `q-${Date.now()}-1`, questionText: '', answerText: '' }];

          setFormData({
            title: c.title || '',
            duration: c.duration || c.limits || '60 Mins',
            description: c.description || '',
            image: c.image || SAMPLE_CONTEST_IMAGES[0],
            questions: existingQuestions,
            status: c.status || 'Active'
          });
          setIsModalOpen(true);
        };

        const handleAddQuestionItem = () => {
          setFormData((prev) => ({
            ...prev,
            questions: [
              ...prev.questions,
              { id: `q-${Date.now()}-${prev.questions.length + 1}`, questionText: '', answerText: '' }
            ]
          }));
        };

        const handleUpdateQuestionItem = (index, field, value) => {
          setFormData((prev) => {
            const updated = [...prev.questions];
            updated[index] = { ...updated[index], [field]: value };
            return { ...prev, questions: updated };
          });
        };

        const handleRemoveQuestionItem = (index) => {
          if (formData.questions.length <= 1) {
            addToast('A test must contain at least one question!', 'warning');
            return;
          }
          setFormData((prev) => ({
            ...prev,
            questions: prev.questions.filter((_, i) => i !== index)
          }));
        };

        const handleSaveContest = async (e) => {
          e.preventDefault();
          if (!formData.title.trim()) {
            addToast('Please enter the Exam / Test Name', 'error');
            return;
          }
          if (!formData.description.trim()) {
            addToast('Please enter exam details or instructions', 'error');
            return;
          }
          if (!formData.duration.trim()) {
            addToast('Please specify the time duration', 'error');
            return;
          }
          if (!formData.questions || formData.questions.length === 0) {
            addToast('Please add at least one question & answer key', 'error');
            return;
          }

          for (let i = 0; i < formData.questions.length; i++) {
            const q = formData.questions[i];
            if (!q.questionText.trim() || !q.answerText.trim()) {
              addToast(`Please complete both Question and Answer fields for Question #${i + 1}`, 'error');
              return;
            }
          }

          if (window.HootDB) {
            await window.HootDB.saveContest({
              ...editingContest,
              ...formData,
              limits: formData.duration
            });
            addToast(editingContest ? 'Live Test updated successfully' : 'Published Live Test & Answer Keys!', 'success');
            setIsModalOpen(false);
            onRefresh();
          }
        };

        const handleDeleteContest = async () => {
          if (!deleteConfirm) return;
          if (window.HootDB) {
            await window.HootDB.deleteContest(deleteConfirm.id);
            addToast('Live Test deleted successfully', 'info');
            setDeleteConfirm(null);
            onRefresh();
          }
        };

        const handleShareAdminExam = (contest) => {
          try {
            let baseUrl = window.location.href.split('?')[0];
            if (baseUrl.endsWith('admin.html')) {
              baseUrl = baseUrl.replace('admin.html', 'index.html');
            }
            const url = new URL(baseUrl);
            url.searchParams.set('examId', contest.id);
            const linkStr = url.toString();

            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(linkStr);
            } else {
              const textArea = document.createElement("textarea");
              textArea.value = linkStr;
              document.body.appendChild(textArea);
              textArea.select();
              document.execCommand("copy");
              document.body.removeChild(textArea);
            }
            addToast(`Exam share link copied for "${contest.title}"! 🔗`, 'success');
          } catch(e) {
            console.error(e);
          }
        };

        return (
          <div className="space-y-6">
            
            {/* Header Controls */}
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200">
              <div>
                <h3 className="text-xl font-black text-slate-900 flex items-center gap-2">
                  <Icon name="Trophy" className="w-5 h-5 text-amber-500" />
                  <span>Live Tests & Exam Answer Keys</span>
                </h3>
                <p className="text-xs text-slate-500 font-medium">Create live exams with title, time duration, details, and official answer keys for users to view and copy.</p>
              </div>

              <button
                onClick={handleOpenCreate}
                className="flex items-center justify-center gap-2 px-5 py-2.5 rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-extrabold text-xs shadow-md cursor-pointer hover:shadow-purple-500/20 transition-all"
              >
                <Icon name="Plus" className="w-4 h-4" />
                <span>+ Create Live Test</span>
              </button>
            </div>

            {/* LIVE TESTS GRID CARDS */}
            {contests.length > 0 ? (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {contests.map((c) => {
                  const questionCount = Array.isArray(c.questions) ? c.questions.length : 0;
                  return (
                    <div key={c.id} className="bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-sm flex flex-col justify-between hover:border-purple-300 transition-all">
                      <div>
                        <div className="h-44 w-full relative overflow-hidden bg-slate-100">
                          <img src={c.image} alt={c.title} className="w-full h-full object-cover" />
                          <div className="absolute top-3 right-3 px-3 py-1 rounded-xl text-[10px] font-extrabold uppercase bg-purple-600 text-white shadow-md">
                            {c.status || 'Active'}
                          </div>
                          <div className="absolute bottom-3 left-3 px-3 py-1 rounded-xl text-[10px] font-extrabold bg-slate-900/80 text-amber-300 backdrop-blur-sm border border-slate-700">
                            ⏱️ {c.duration || c.limits || '60 Mins'}
                          </div>
                        </div>

                        <div className="p-6">
                          <div className="flex items-center justify-between mb-2">
                            <span className="text-[11px] font-black text-purple-700 bg-purple-50 px-2.5 py-1 rounded-lg border border-purple-200">
                              📝 {questionCount} Answer {questionCount === 1 ? 'Key' : 'Keys'}
                            </span>
                          </div>

                          <h3 className="text-lg font-bold text-slate-900 mb-2">{c.title}</h3>
                          <p className="text-xs text-slate-600 font-medium line-clamp-2 leading-relaxed mb-4">{c.description}</p>
                        </div>
                      </div>

                      <div className="p-6 pt-0 border-t border-slate-100 flex items-center justify-between mt-2">
                        <span className="text-xs font-mono font-bold text-slate-400">Duration: {c.duration || c.limits || '60 Mins'}</span>
                        <div className="flex items-center gap-2">
                          <button onClick={() => handleShareAdminExam(c)} className="p-2 rounded-xl bg-purple-50 text-purple-700 hover:bg-purple-100 border border-purple-200 cursor-pointer" title="Copy shareable link for users">
                            <Icon name="Share2" className="w-4 h-4 text-purple-600" />
                          </button>
                          <button onClick={() => handleOpenEdit(c)} className="p-2 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 border border-slate-300 cursor-pointer" title="Edit exam">
                            <Icon name="Edit2" className="w-4 h-4 text-slate-600" />
                          </button>
                          <button onClick={() => setDeleteConfirm(c)} className="p-2 rounded-xl bg-rose-50 text-rose-600 hover:bg-rose-100 border border-rose-200 cursor-pointer" title="Delete exam">
                            <Icon name="Trash2" className="w-4 h-4" />
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            ) : (
              <div className="p-12 text-center bg-white rounded-3xl border border-slate-200 shadow-sm max-w-lg mx-auto">
                <Icon name="Trophy" className="w-12 h-12 text-slate-300 mx-auto mb-3" />
                <h4 className="text-base font-bold text-slate-800">No Live Tests Created Yet</h4>
                <p className="text-xs text-slate-500 mt-1 mb-4">Click "+ Create Live Test" above to publish your first exam with questions and answer keys.</p>
                <button
                  onClick={handleOpenCreate}
                  className="px-5 py-2.5 rounded-2xl bg-purple-600 text-white font-extrabold text-xs shadow-md cursor-pointer"
                >
                  + Create Live Test Now
                </button>
              </div>
            )}
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                <div className="relative w-full max-w-2xl bg-white border border-slate-200 rounded-3xl shadow-2xl p-6 max-h-[90vh] overflow-y-auto">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-200 mb-4">
                    <h3 className="text-lg font-black text-slate-900 flex items-center gap-2">
                      <Icon name="Trophy" className="w-5 h-5 text-amber-500" />
                      <span>{editingContest ? 'Edit Live Test & Answer Key' : 'Create New Live Test'}</span>
                    </h3>
                    <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-700">
                      <Icon name="X" className="w-5 h-5" />
                    </button>
                  </div>

                  <form onSubmit={handleSaveContest} className="space-y-5">
                    
                    {/* Exam Name */}
                    <div>
                      <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Name of the Exam *</label>
                      <input
                        type="text"
                        required
                        value={formData.title}
                        onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                        placeholder="e.g. Python Developer Certification Final Exam 2026"
                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold text-slate-900 focus:outline-none"
                      />
                    </div>

                    {/* Time Duration */}
                    <div>
                      <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Time Duration (Time to Complete) *</label>
                      <input
                        type="text"
                        required
                        value={formData.duration}
                        onChange={(e) => setFormData({ ...formData, duration: e.target.value })}
                        placeholder="e.g. 60 Mins, 90 Mins, 2 Hours"
                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold text-slate-900 focus:outline-none"
                      />
                    </div>

                    {/* Details / Instructions */}
                    <div>
                      <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Details & Overview *</label>
                      <textarea
                        required
                        rows={3}
                        value={formData.description}
                        onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                        placeholder="Exam overview, total marks, instructions, passing criteria..."
                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium text-slate-900 focus:outline-none"
                      />
                    </div>

                    {/* Image Selector */}
                    <div>
                      <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Exam Banner Image URL *</label>
                      <input
                        type="text"
                        required
                        value={formData.image}
                        onChange={(e) => setFormData({ ...formData, image: e.target.value })}
                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-mono text-slate-900 focus:outline-none mb-2"
                      />
                      
                      <div className="text-[11px] font-bold text-slate-500 mb-1">Or Select Sample Banner:</div>
                      <div className="flex gap-2">
                        {SAMPLE_CONTEST_IMAGES.map((img, i) => (
                          <img
                            key={i}
                            src={img}
                            onClick={() => setFormData({ ...formData, image: img })}
                            className={`w-16 h-10 object-cover rounded-xl cursor-pointer border-2 ${formData.image === img ? 'border-purple-600 scale-105' : 'border-transparent'}`}
                          />
                        ))}
                      </div>
                    </div>

                    {/* DYNAMIC QUESTIONS & ANSWER KEYS SECTION */}
                    <div className="pt-4 border-t border-slate-200">
                      <div className="flex items-center justify-between mb-4">
                        <div>
                          <h4 className="text-sm font-black text-slate-900 uppercase tracking-wide">Exam Questions & Answer Keys ({formData.questions.length})</h4>
                          <p className="text-[11px] text-slate-500">Enter questions and their solution answer key code below.</p>
                        </div>
                        <button
                          type="button"
                          onClick={handleAddQuestionItem}
                          className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-purple-100 text-purple-800 text-xs font-extrabold border border-purple-300 hover:bg-purple-200 cursor-pointer shadow-sm"
                        >
                          <Icon name="Plus" className="w-3.5 h-3.5" />
                          <span>+ Add Question</span>
                        </button>
                      </div>

                      <div className="space-y-4 max-h-72 overflow-y-auto pr-1">
                        {formData.questions.map((q, idx) => (
                          <div key={q.id || idx} className="p-4 rounded-2xl bg-slate-50 border border-slate-200 relative group">
                            <div className="flex items-center justify-between mb-2 pb-2 border-b border-slate-200">
                              <span className="text-xs font-black text-purple-700 font-mono">Question #{idx + 1}</span>
                              {formData.questions.length > 1 && (
                                <button
                                  type="button"
                                  onClick={() => handleRemoveQuestionItem(idx)}
                                  className="text-rose-500 hover:text-rose-700 text-xs font-bold flex items-center gap-1 cursor-pointer"
                                >
                                  <Icon name="Trash2" className="w-3.5 h-3.5" />
                                  <span>Remove</span>
                                </button>
                              )}
                            </div>

                            <div className="space-y-3">
                              <div>
                                <label className="block text-[11px] font-bold text-slate-600 uppercase mb-1">Question Statement / Prompt *</label>
                                <input
                                  type="text"
                                  required
                                  value={q.questionText}
                                  onChange={(e) => handleUpdateQuestionItem(idx, 'questionText', e.target.value)}
                                  placeholder={`e.g. Q${idx + 1}: Write a function to check prime numbers in Python`}
                                  className="w-full px-3.5 py-2 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-900 focus:outline-none"
                                />
                              </div>

                              <div>
                                <label className="block text-[11px] font-bold text-slate-600 uppercase mb-1">Answer / Solution Answer Key *</label>
                                <textarea
                                  required
                                  rows={4}
                                  value={q.answerText}
                                  onChange={(e) => handleUpdateQuestionItem(idx, 'answerText', e.target.value)}
                                  placeholder={`Enter the full answer code / text solution for Q${idx + 1}...`}
                                  className="w-full px-3.5 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs font-mono text-cyan-200 focus:outline-none"
                                />
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="pt-4 border-t border-slate-200 flex items-center justify-end gap-3">
                      <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                      <button type="submit" className="px-6 py-2.5 rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-xs font-extrabold shadow-md cursor-pointer">
                        {editingContest ? 'Update Test' : 'Publish Test'}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Delete Confirmation Modal */}
            {deleteConfirm && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
                <div className="relative w-full max-w-md bg-white border border-rose-200 rounded-3xl p-6 shadow-xl">
                  <h3 className="text-lg font-black text-slate-900 mb-2">Delete Live Test?</h3>
                  <p className="text-xs text-slate-600 mb-4 font-medium">Are you sure you want to delete "{deleteConfirm.title}" and its answer keys?</p>
                  <div className="flex items-center justify-end gap-3 pt-3 border-t border-slate-200">
                    <button onClick={() => setDeleteConfirm(null)} className="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                    <button onClick={handleDeleteContest} className="px-5 py-2.5 rounded-2xl bg-rose-600 text-white text-xs font-extrabold shadow-sm">Confirm Delete</button>
                  </div>
                </div>
              </div>
            )}

          </div>
        );
      }

      // Root Admin Dashboard Component
      function AdminDashboard({ adminUser, onLogout, repositories, subfolders, questions, contests, applications, onRefresh, addToast }) {
        const [activeTab, setActiveTab] = useState('repos'); // 'repos' | 'contests'
        const [confirmClearAll, setConfirmClearAll] = useState(false);

        const totalRepos = repositories.length;
        const totalSubfolders = (subfolders || []).length;
        const totalQuestions = questions.length;
        const totalContests = contests.length;

        const handleClearAllData = async () => {
          try {
            await window.HootDB.clearAllRepositories();
            addToast('All repositories, subfolders, and questions cleared', 'warning');
            setConfirmClearAll(false);
            onRefresh();
          } catch (err) {
            addToast('Error clearing repositories: ' + err.message, 'error');
          }
        };

        return (
          <div className="py-8 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8 pb-6 border-b border-slate-200">
              <div>
                <div className="flex items-center gap-2 text-xs font-bold text-purple-600 uppercase tracking-widest mb-1">
                  <Icon name="ShieldCheck" className="w-4 h-4" />
                  <span>Admin Portal Dashboard</span>
                </div>
                <h1 className="text-2xl sm:text-3xl font-black text-slate-900">
                  Management & Solution Controls
                </h1>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => setConfirmClearAll(true)}
                  className="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-bold shadow-sm cursor-pointer"
                  title="Clear All Repositories"
                >
                  <Icon name="Trash2" className="w-3.5 h-3.5 text-rose-600" />
                  <span>Clear Repositories</span>
                </button>

                <button
                  onClick={() => { onRefresh(); addToast('Refreshed data from Firebase', 'info'); }}
                  className="p-2.5 rounded-xl bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-sm cursor-pointer"
                  title="Refresh Data"
                >
                  <Icon name="RefreshCw" className="w-4 h-4 text-purple-600" />
                </button>

                <button
                  onClick={onLogout}
                  className="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold shadow-sm cursor-pointer"
                >
                  <Icon name="LogOut" className="w-3.5 h-3.5 text-pink-400" />
                  <span>Sign Out</span>
                </button>
              </div>
            </div>

            {/* KPI STATS GRID */}
            <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-8">
              <div className="glass-panel p-5 rounded-3xl border border-slate-200 bg-white flex items-center justify-between shadow-sm">
                <div>
                  <div className="text-xs text-slate-500 font-bold mb-1">Repositories</div>
                  <div className="text-3xl font-black text-slate-900">{totalRepos}</div>
                </div>
                <div className="p-3.5 rounded-2xl bg-purple-50 border border-purple-200 text-purple-600 shadow-sm">
                  <Icon name="FolderGit2" className="w-6 h-6" />
                </div>
              </div>

              <div className="glass-panel p-5 rounded-3xl border border-slate-200 bg-white flex items-center justify-between shadow-sm">
                <div>
                  <div className="text-xs text-slate-500 font-bold mb-1">Subfolders</div>
                  <div className="text-3xl font-black text-indigo-600">{totalSubfolders}</div>
                </div>
                <div className="p-3.5 rounded-2xl bg-indigo-50 border border-indigo-200 text-indigo-600 shadow-sm">
                  <Icon name="Folder" className="w-6 h-6" />
                </div>
              </div>

              <div className="glass-panel p-5 rounded-3xl border border-slate-200 bg-white flex items-center justify-between shadow-sm">
                <div>
                  <div className="text-xs text-slate-500 font-bold mb-1">Q&A Solutions</div>
                  <div className="text-3xl font-black text-sky-600">{totalQuestions}</div>
                </div>
                <div className="p-3.5 rounded-2xl bg-sky-50 border border-sky-200 text-sky-600 shadow-sm">
                  <Icon name="HelpCircle" className="w-6 h-6" />
                </div>
              </div>

              <div className="glass-panel p-5 rounded-3xl border border-slate-200 bg-white flex items-center justify-between shadow-sm">
                <div>
                  <div className="text-xs text-slate-500 font-bold mb-1">Live Tests</div>
                  <div className="text-3xl font-black text-amber-600">{totalContests}</div>
                </div>
                <div className="p-3.5 rounded-2xl bg-amber-50 border border-amber-200 text-amber-600 shadow-sm">
                  <Icon name="Trophy" className="w-6 h-6" />
                </div>
              </div>
            </div>

            {/* TAB SWITCHER */}
            <div className="flex items-center gap-2 border-b border-slate-200 mb-6">
              <button
                onClick={() => setActiveTab('repos')}
                className={`flex items-center gap-2 px-5 py-3 text-sm font-extrabold border-b-2 transition-all cursor-pointer ${
                  activeTab === 'repos' ? 'border-purple-600 text-purple-700' : 'border-transparent text-slate-500'
                }`}
              >
                <Icon name="FolderGit2" className="w-4 h-4" />
                <span>Workspace Hierarchy ({totalRepos} Repos)</span>
              </button>

              <button
                onClick={() => setActiveTab('contests')}
                className={`flex items-center gap-2 px-5 py-3 text-sm font-extrabold border-b-2 transition-all cursor-pointer ${
                  activeTab === 'contests' ? 'border-amber-600 text-amber-700' : 'border-transparent text-slate-500'
                }`}
              >
                <Icon name="Trophy" className="w-4 h-4" />
                <span>Live Tests & Answer Keys ({totalContests})</span>
              </button>
            </div>

            {/* TAB PANELS */}
            {activeTab === 'repos' && (
              <RepoManager
                repositories={repositories}
                subfolders={subfolders}
                questions={questions}
                onRefresh={onRefresh}
                addToast={addToast}
              />
            )}

            {activeTab === 'contests' && (
              <ContestsManager
                contests={contests}
                applications={applications}
                onRefresh={onRefresh}
                addToast={addToast}
              />
            )}

            {confirmClearAll && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
                <div className="relative w-full max-w-md bg-white border border-rose-200 rounded-3xl p-6">
                  <div className="flex items-center gap-3 text-rose-600 mb-3">
                    <Icon name="Trash2" className="w-6 h-6" />
                    <h3 className="text-lg font-black text-slate-900">Purge All Repositories?</h3>
                  </div>
                  <p className="text-xs text-slate-600 font-medium leading-relaxed mb-4">
                    This will clear all repositories, subfolders, and questions from the database so you can start with a 100% clean list.
                  </p>
                  <div className="flex items-center justify-end gap-3 pt-3 border-t border-slate-200">
                    <button onClick={() => setConfirmClearAll(false)} className="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                    <button onClick={handleClearAllData} className="px-5 py-2.5 rounded-2xl bg-rose-600 text-white text-xs font-extrabold">Confirm Clear</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      // Root Admin Application
      function AdminApp() {
        const [adminUser, setAdminUser] = useState(null);
        const [repositories, setRepositories] = useState([]);
        const [subfolders, setSubfolders] = useState([]);
        const [questions, setQuestions] = useState([]);
        const [contests, setContests] = useState([]);
        const [applications, setApplications] = useState([]);
        const [toasts, setToasts] = useState([]);

        const addToast = (message, type = 'info') => {
          const id = Date.now() + Math.random();
          setToasts((prev) => [...prev, { id, message, type }]);
        };

        const removeToast = (id) => setToasts((prev) => prev.filter((t) => t.id !== id));

        const loadData = async () => {
          if (!window.HootDB) return;
          try {
            await window.HootDB.seedInitialDataIfNeeded();
            const repos = await window.HootDB.fetchRepositories();
            const sfList = await window.HootDB.fetchSubfolders ? await window.HootDB.fetchSubfolders() : [];
            const qList = await window.HootDB.fetchQuestions();
            const cList = await window.HootDB.fetchContests();
            const aList = await window.HootDB.fetchContestApplications();
            setRepositories(repos);
            setSubfolders(sfList);
            setQuestions(qList);
            setContests(cList);
            setApplications(aList);
          } catch (err) { console.warn(err); }
        };

        useEffect(() => {
          if (window.HootDB) {
            loadData();
            const unsubApps = window.HootDB.subscribeToApplications ? window.HootDB.subscribeToApplications((apps) => setApplications(apps)) : null;
            const unsubSubfolders = window.HootDB.subscribeToSubfolders ? window.HootDB.subscribeToSubfolders((sf) => setSubfolders(sf)) : null;
            return () => {
              if (typeof unsubApps === 'function') unsubApps();
              if (typeof unsubSubfolders === 'function') unsubSubfolders();
            };
          } else {
            const handleReady = () => {
              loadData();
              if (window.HootDB && window.HootDB.subscribeToApplications) {
                window.HootDB.subscribeToApplications((apps) => setApplications(apps));
              }
              if (window.HootDB && window.HootDB.subscribeToSubfolders) {
                window.HootDB.subscribeToSubfolders((sf) => setSubfolders(sf));
              }
            };
            window.addEventListener('HootDBReady', handleReady);
            return () => window.removeEventListener('HootDBReady', handleReady);
          }
        }, []);

        return (
          <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900 font-sans">
            <ToastContainer toasts={toasts} removeToast={removeToast} />

            <header className="sticky top-0 z-40 w-full border-b border-slate-200 bg-white/90 backdrop-blur-xl shadow-sm">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-600 via-pink-500 to-sky-500 p-[1.5px] shadow-sm">
                    <div className="w-full h-full bg-white rounded-[10px] flex items-center justify-center">
                      <Icon name="ShieldCheck" className="w-5 h-5 text-purple-600" />
                    </div>
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-extrabold text-lg text-slate-900">Hoot <span className="gradient-text-purple">Miner</span></span>
                      <span className="px-2.5 py-0.5 text-[10px] font-extrabold uppercase rounded-lg bg-purple-100 text-purple-800 border border-purple-200">
                        Admin Portal
                      </span>
                    </div>
                    <div className="text-[11px] text-slate-500 font-medium font-sans">Management & Solution Controls</div>
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  <a
                    href="index.html"
                    className="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-100 border border-slate-200 text-xs font-bold text-slate-700 hover:text-purple-700 transition-all shadow-sm"
                  >
                    <Icon name="ArrowLeft" className="w-3.5 h-3.5 text-purple-600" />
                    <span>Public App &rarr;</span>
                  </a>
                </div>
              </div>
            </header>

            <main className="flex-1 w-full">
              {adminUser ? (
                <AdminDashboard
                  adminUser={adminUser}
                  onLogout={() => { setAdminUser(null); addToast('Signed out of Admin Portal', 'info'); }}
                  repositories={repositories}
                  subfolders={subfolders}
                  questions={questions}
                  contests={contests}
                  applications={applications}
                  onRefresh={loadData}
                  addToast={addToast}
                />
              ) : (
                <AdminLogin onLoginSuccess={(user) => setAdminUser(user)} addToast={addToast} />
              )}
            </main>

            <footer className="border-t border-slate-200 bg-white py-6 text-center text-xs text-slate-500 font-medium">
              <div>Hoot Miner Admin System • Restricted Portal • All Actions Logged</div>
            </footer>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('admin-root'));
      root.render(<AdminApp />);
    </script>
  </body>
</html>

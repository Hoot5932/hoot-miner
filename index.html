    <!-- Firebase SDK Imports via CDN -->
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCQuvmmOqLwtD9Fvf19Va7eo8FKVoSdOJ4",
        authDomain: "hoot-5c731.firebaseapp.com",
        databaseURL: "https://hoot-5c731-default-rtdb.firebaseio.com",
        projectId: "hoot-5c731",
        storageBucket: "hoot-5c731.firebasestorage.app",
        messagingSenderId: "890493257903",
        appId: "1:890493257903:web:4e238fbeb92ce9145eac5a",
        measurementId: "G-9JSR65RKNQ"
      };

      const app = initializeApp(firebaseConfig);
      const rtdb = getDatabase(app);

      const DEFAULT_DEMO_REPO_IDS = ['repo-c-1', 'repo-c-2', 'repo-py-1', 'repo-java-1', 'repo-java-2'];
      const DEFAULT_DEMO_QUESTION_IDS = ['q-c-1', 'q-cpp-1', 'q-cpp-2', 'q-py-1', 'q-java-1', 'q-java-2'];
      const LOCAL_STORAGE_REPOS_KEY = "hootminer_repos";
      const LOCAL_STORAGE_QUESTIONS_KEY = "hootminer_questions";
      const LOCAL_STORAGE_CONTESTS_KEY = "hootminer_contests";
      const LOCAL_STORAGE_SUBFOLDERS_KEY = "hootminer_subfolders";

      window.HootDB = {
        async seedInitialDataIfNeeded() {
          try {
            for (const id of DEFAULT_DEMO_REPO_IDS) await remove(ref(rtdb, `repositories/${id}`));
            for (const qId of DEFAULT_DEMO_QUESTION_IDS) await remove(ref(rtdb, `questions_answers/${qId}`));
          } catch (err) {
            console.warn(err);
          }
        },

        async fetchRepositories() {
          try {
            const snapshot = await get(ref(rtdb, "repositories"));
            if (snapshot.exists()) {
              return Object.values(snapshot.val()).filter(r => r && !DEFAULT_DEMO_REPO_IDS.includes(r.id));
            }
            return [];
          } catch (err) {
            const local = localStorage.getItem(LOCAL_STORAGE_REPOS_KEY);
            return local ? JSON.parse(local).filter(r => r && !DEFAULT_DEMO_REPO_IDS.includes(r.id)) : [];
          }
        },

        async fetchQuestions() {
          try {
            const snapshot = await get(ref(rtdb, "questions_answers"));
            if (snapshot.exists()) {
              return Object.values(snapshot.val()).filter(q => q && !DEFAULT_DEMO_QUESTION_IDS.includes(q.id));
            }
            return [];
          } catch (err) {
            const local = localStorage.getItem(LOCAL_STORAGE_QUESTIONS_KEY);
            return local ? JSON.parse(local).filter(q => q && !DEFAULT_DEMO_QUESTION_IDS.includes(q.id)) : [];
          }
        },

        async fetchSubfolders() {
          try {
            const snapshot = await get(ref(rtdb, "subfolders"));
            if (snapshot.exists()) {
              return Object.values(snapshot.val());
            }
            return [];
          } catch (err) {
            const local = localStorage.getItem(LOCAL_STORAGE_SUBFOLDERS_KEY);
            return local ? JSON.parse(local) : [];
          }
        },

        subscribeToRepositories(callback) {
          return onValue(ref(rtdb, "repositories"), (snapshot) => {
            if (snapshot.exists()) {
              callback(Object.values(snapshot.val()).filter(r => r && !DEFAULT_DEMO_REPO_IDS.includes(r.id)));
            } else {
              callback([]);
            }
          });
        },

        subscribeToSubfolders(callback) {
          return onValue(ref(rtdb, "subfolders"), (snapshot) => {
            if (snapshot.exists()) {
              callback(Object.values(snapshot.val()));
            } else {
              callback([]);
            }
          });
        },

        subscribeToQuestions(callback) {
          return onValue(ref(rtdb, "questions_answers"), (snapshot) => {
            if (snapshot.exists()) {
              callback(Object.values(snapshot.val()).filter(q => q && !DEFAULT_DEMO_QUESTION_IDS.includes(q.id)));
            } else {
              callback([]);
            }
          });
        },

        async fetchContests() {
          try {
            const snapshot = await get(ref(rtdb, "contests"));
            if (snapshot.exists()) return Object.values(snapshot.val());
            return [];
          } catch (err) {
            const local = localStorage.getItem(LOCAL_STORAGE_CONTESTS_KEY);
            return local ? JSON.parse(local) : [];
          }
        },

        subscribeToContests(callback) {
          return onValue(ref(rtdb, "contests"), (snapshot) => {
            if (snapshot.exists()) callback(Object.values(snapshot.val()));
            else callback([]);
          });
        },

        async submitContestApplication(application) {
          const id = `app-${Date.now()}`;
          const now = new Date().toISOString();
          const appData = { ...application, id, status: application.status || 'Pending', appliedAt: now };
          try { await set(ref(rtdb, `contest_applications/${id}`), appData); } catch (e) { console.warn(e); }
          const localApps = localStorage.getItem("hootminer_applications");
          const parsed = localApps ? JSON.parse(localApps) : [];
          parsed.push(appData);
          localStorage.setItem("hootminer_applications", JSON.stringify(parsed));
          return appData;
        },

        async fetchContestApplications() {
          try {
            const snapshot = await get(ref(rtdb, "contest_applications"));
            if (snapshot.exists()) return Object.values(snapshot.val());
            return [];
          } catch (e) {
            const local = localStorage.getItem("hootminer_applications");
            return local ? JSON.parse(local) : [];
          }
        },

        subscribeToApplications(callback) {
          return onValue(ref(rtdb, "contest_applications"), (snapshot) => {
            if (snapshot.exists()) callback(Object.values(snapshot.val()));
            else callback([]);
          });
        },

        async updateApplicationStatus(appId, newStatus) {
          try { await set(ref(rtdb, `contest_applications/${appId}/status`), newStatus); } catch (e) { console.warn(e); }
          const localApps = localStorage.getItem("hootminer_applications");
          if (localApps) {
            const parsed = JSON.parse(localApps);
            const idx = parsed.findIndex(a => a.id === appId);
            if (idx >= 0) {
              parsed[idx].status = newStatus;
              localStorage.setItem("hootminer_applications", JSON.stringify(parsed));
            }
          }
          return true;
        },

        async loginUserAccount(email, password) {
          const cleanEmail = email.trim().toLowerCase();
          try {
            const safeKey = cleanEmail.replace(/[^a-zA-Z0-9]/g, "_");
            const snapshot = await get(ref(rtdb, `users/${safeKey}`));
            if (snapshot.exists()) {
              const user = snapshot.val();
              if (user.password === password) {
                localStorage.setItem("hootminer_current_user", JSON.stringify(user));
                return { success: true, user };
              } else {
                return { success: false, message: "Incorrect password. Please check your password." };
              }
            }
          } catch (e) {
            console.warn("Firebase login fallback:", e);
          }

          const localUsers = localStorage.getItem("hootminer_all_users");
          const parsed = localUsers ? JSON.parse(localUsers) : [];
          const user = parsed.find(u => u.contactEmail.toLowerCase() === cleanEmail);

          if (user) {
            if (user.password === password) {
              localStorage.setItem("hootminer_current_user", JSON.stringify(user));
              return { success: true, user };
            } else {
              return { success: false, message: "Incorrect password. Please check your password." };
            }
          }

          return { success: false, message: "No account found with this email. Please click 'Create New Account'." };
        }
      };
      window.dispatchEvent(new Event('HootDBReady'));
    </script>

      // Toast Components
      function ToastContainer({ toasts, removeToast }) {
        return (
          <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
            {toasts.map((toast) => (
              <ToastItem key={toast.id} toast={toast} onDismiss={() => removeToast(toast.id)} />
            ))}
          </div>
        );
      }

      function ToastItem({ toast, onDismiss }) {
        useEffect(() => {
          const timer = setTimeout(() => onDismiss(), toast.duration || 3500);
          return () => clearTimeout(timer);
        }, [toast, onDismiss]);

        const borders = {
          success: 'border-emerald-500/30 bg-emerald-950/80 text-emerald-100',
          error: 'border-rose-500/30 bg-rose-950/80 text-rose-100',
          warning: 'border-amber-500/30 bg-amber-950/80 text-amber-100',
          info: 'border-cyan-500/30 bg-cyan-950/80 text-cyan-100'
        };

        return (
          <div className={`pointer-events-auto flex items-center justify-between gap-3 p-4 rounded-2xl border backdrop-blur-md shadow-xl transition-all ${borders[toast.type] || borders.info}`}>
            <div className="flex items-center gap-3">
              <Icon name={toast.type === 'success' ? 'CheckCircle2' : 'Info'} className="w-5 h-5 shrink-0" />
              <span className="text-sm font-semibold">{toast.message}</span>
            </div>
            <button onClick={onDismiss} className="text-slate-400 hover:text-slate-200 p-1 rounded-lg">
              <Icon name="X" className="w-4 h-4" />
            </button>
          </div>
        );
      }

      // Navbar Component with Right Side Profile Icon

        const handleShareExam = (e) => {

            const url = new URL(window.location.href);
            url.searchParams.set('examId', contest.id);
            const shareUrlStr = url.toString();

            if (navigator.clipboard && navigator.clipboard.writeText) {

              const textArea = document.createElement("textarea");
              textArea.value = shareUrlStr;
              document.body.appendChild(textArea);
              textArea.select();
              document.execCommand("copy");
              document.body.removeChild(textArea);

            setCopiedShare(true);
            if (addToast) addToast(`Share link for "${contest.title}" copied to clipboard! 🔗`, 'success');

      // Modal Component for Viewing Exam Questions & Answer Keys with Copy Button
      function ViewAnswerKeyModal({ test, onClose, addToast }) {
        const [copiedIndex, setCopiedIndex] = useState(null);
        const [copiedShare, setCopiedShare] = useState(false);

        if (!test) return null;
        const questions = Array.isArray(test.questions) ? test.questions : [];

        const handleCopyAnswer = (answerText, index) => {
          if (!answerText) return;
          navigator.clipboard.writeText(answerText);
          setCopiedIndex(index);
          addToast(`Question #${index + 1} answer copied to clipboard!`, 'success');
          setTimeout(() => {
            setCopiedIndex(null);
          }, 2500);
        };

        const handleShareExamLink = () => {
          try {
            const url = new URL(window.location.href);
            url.searchParams.set('examId', test.id);
            const shareUrlStr = url.toString();

            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(shareUrlStr);
            } else {
              const textArea = document.createElement("textarea");
              textArea.value = shareUrlStr;
              document.body.appendChild(textArea);
              textArea.select();
              document.execCommand("copy");
              document.body.removeChild(textArea);
            }

            setCopiedShare(true);
            if (addToast) addToast(`Live Exam share link copied to clipboard! 🔗`, 'success');
            setTimeout(() => setCopiedShare(false), 2500);
          } catch(err) {
            console.error("Failed to copy share link:", err);
          }
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
            <div className="relative w-full max-w-3xl bg-slate-900 border border-purple-500/40 rounded-3xl shadow-2xl p-6 sm:p-8 max-h-[90vh] flex flex-col justify-between text-white">
              
              {/* Header */}

                <div className="flex items-center justify-between pb-4 border-b border-slate-800 mb-4">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-2xl bg-purple-600/20 border border-purple-500/40 flex items-center justify-center text-purple-400">
                      <Icon name="Key" className="w-5 h-5" />
                    </div>
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="text-[10px] font-black uppercase text-purple-400 tracking-wider">Exam Answer Key</span>
                        <span className="px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-300 text-[10px] font-bold border border-amber-500/30">
                          ⏱️ {test.duration || test.limits || '60 Mins'}
                        </span>
                      </div>
                      <h3 className="text-xl font-black text-white">{test.title}</h3>
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <button
                      onClick={handleShareExamLink}
                      className={`px-3.5 py-2 rounded-xl text-xs font-extrabold border transition-all flex items-center gap-1.5 cursor-pointer ${
                        copiedShare
                          ? 'bg-emerald-600 text-white border-emerald-500 shadow-md'
                          : 'bg-purple-950/80 hover:bg-purple-900 text-purple-200 hover:text-white border-purple-700/60'
                      }`}
                      title="Copy direct shareable link for this live exam"
                    >
                      <Icon name={copiedShare ? "Check" : "Share2"} className="w-3.5 h-3.5" />
                      <span>{copiedShare ? "Link Copied! ✓" : "Share 🔗"}</span>
                    </button>

                    <button
                      onClick={onClose}
                      className="p-2 rounded-xl bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition-all cursor-pointer"
                    >
                      <Icon name="X" className="w-5 h-5" />
                    </button>
                  </div>
                </div>

                {/* Exam Overview */}
                {test.description && (
                  <div className="mb-6 p-4 rounded-2xl bg-slate-800/60 border border-slate-700/60 text-xs font-medium text-slate-300 leading-relaxed">
                    <strong className="text-white block mb-1">Details & Rules:</strong>
                    {test.description}
                  </div>
                )}
              </div>

              {/* Questions & Answer Keys List */}
              <div className="flex-1 overflow-y-auto space-y-6 pr-2 mb-4">
                {questions.length > 0 ? (
                  questions.map((q, idx) => (
                    <div key={q.id || idx} className="p-5 rounded-2xl bg-slate-950 border border-slate-800 space-y-3 shadow-md">
                      <div className="flex items-start justify-between gap-4">
                        <div className="flex items-start gap-3">
                          <span className="px-2.5 py-1 rounded-xl bg-purple-900/80 text-purple-200 text-xs font-mono font-black border border-purple-700 shrink-0">
                            Q{idx + 1}
                          </span>
                          <h4 className="text-sm font-bold text-white leading-snug pt-0.5">{q.questionText}</h4>
                        </div>

                        {/* Copy Answer Button */}
                        <button
                          onClick={() => handleCopyAnswer(q.answerText, idx)}
                          className={`px-3.5 py-1.5 rounded-xl font-extrabold text-xs border transition-all shrink-0 flex items-center gap-1.5 cursor-pointer ${
                            copiedIndex === idx
                              ? 'bg-emerald-600 text-white border-emerald-500 shadow-lg scale-105'

                          {copiedIndex === idx ? (
                            <>

                              <span>Copied! ✓</span>
                            </>

                            <>
                              <Icon name="Copy" className="w-3.5 h-3.5" />
                              <span>Copy Answer</span>
                            </>
                          )}

              {/* Modal Footer */}
              <div className="pt-4 border-t border-slate-800 flex items-center justify-end">

                >

                </button>
              </div>

            </div>
          </div>
        );

      // RepositoryHub Component (Level 1: Repositories List)
      function RepositoryHub({ repositories, subfolders, questions, onSelectRepo }) {
        const [selectedCategory, setSelectedCategory] = useState('All');
        const [searchQuery, setSearchQuery] = useState('');
        const [sortBy, setSortBy] = useState('newest');

        const categories = useMemo(() => ['All', 'C / C++', 'Python', 'Java'], []);

        const repoSubfolderCounts = useMemo(() => {
          const counts = {};
          (subfolders || []).forEach(sf => { counts[sf.repositoryId] = (counts[sf.repositoryId] || 0) + 1; });
          return counts;
        }, [subfolders]);

        const repoQuestionCounts = useMemo(() => {
          const counts = {};
          (questions || []).forEach(q => { counts[q.repositoryId] = (counts[q.repositoryId] || 0) + 1; });
          return counts;
        }, [questions]);

        const filteredRepos = useMemo(() => {
          return repositories.filter(repo => {
            const matchesCategory = selectedCategory === 'All' || repo.category === selectedCategory;
            const matchesSearch = repo.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                  repo.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                  repo.category.toLowerCase().includes(searchQuery.toLowerCase());
            return matchesCategory && matchesSearch && repo.visibility !== 'Draft';
          }).sort((a, b) => {
            if (sortBy === 'newest') return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
            if (sortBy === 'questions') return (repoQuestionCounts[b.id] || 0) - (repoQuestionCounts[a.id] || 0);
            if (sortBy === 'title') return a.title.localeCompare(b.title);
            return 0;
          });
        }, [repositories, selectedCategory, searchQuery, sortBy, repoQuestionCounts]);

        return (
          <section className="py-12 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
              <div>
                <div className="flex items-center gap-2 text-xs font-bold text-purple-600 uppercase tracking-widest mb-1">
                  <Icon name="FolderGit2" className="w-4 h-4" />
                  <span>Public Code Workspaces</span>
                </div>
                <h2 className="text-3xl sm:text-4xl font-black text-slate-900">
                  Repository <span className="gradient-text-purple">Collection</span>
                </h2>
              </div>

              <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                <div className="relative flex-1 sm:w-64">
                  <Icon name="Search" className="w-4 h-4 text-purple-500 absolute left-3.5 top-1/2 -translate-y-1/2" />
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Search repositories..."
                    className="w-full pl-10 pr-4 py-2.5 text-sm bg-white border border-slate-200 rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-purple-500 shadow-sm font-medium"

              </div>
            </div>

            <div className="flex items-center gap-3 overflow-x-auto pb-4 mb-8">
              {categories.map((cat) => (
                <button
                  key={cat}
                  onClick={() => setSelectedCategory(cat)}
                  className={`px-5 py-2.5 rounded-2xl text-xs font-extrabold whitespace-nowrap border transition-all cursor-pointer ${
                    selectedCategory === cat
                      ? 'bg-gradient-to-r from-purple-600 via-pink-600 to-indigo-600 text-white border-purple-600 shadow-md'
                      : 'bg-white text-slate-700 border-slate-200 hover:border-purple-300 hover:text-purple-700 shadow-sm'
                  }`}
                >
                  {cat}
                </button>

            </div>

            {filteredRepos.length > 0 ? (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {filteredRepos.map((repo) => {
                  const sfCount = repoSubfolderCounts[repo.id] || 0;
                  const qCount = repoQuestionCounts[repo.id] || 0;
                  return (
                    <div

                            <Icon name="Folder" className="w-3 h-3 text-indigo-500" />
                            {sfCount} {sfCount === 1 ? 'Folder' : 'Folders'}

                        </div>

                        <h3 className="text-xl font-bold text-slate-900 mb-2 group-hover:text-purple-700 transition-colors line-clamp-2">

                          <Icon name="HelpCircle" className="w-3.5 h-3.5 text-sky-600" />
                          {qCount} Q&A Solutions

                        <span className="group-hover:translate-x-1 transition-transform">Explore Subfolders &rarr;</span>
                      </div>
                    </div>

              </div>
            ) : (
              <div className="p-12 text-center bg-white rounded-3xl border border-slate-200 shadow-sm max-w-lg mx-auto">
                <Icon name="FolderGit2" className="w-12 h-12 text-slate-400 mx-auto mb-3" />

      // Footer Component
      function Footer() {
        return (
          <footer className="mt-auto border-t border-slate-200/80 bg-white py-8">

              © 2026 Hoot Miner Platform. All rights reserved.

      // MAIN PUBLIC APP
      function App() {
        const [activeTab, setActiveTab] = useState('home');
        const [selectedRepo, setSelectedRepo] = useState(null);
        const [repositories, setRepositories] = useState([]);
        const [subfolders, setSubfolders] = useState([]);
        const [questions, setQuestions] = useState([]);
        const [contests, setContests] = useState([]);
        const [applications, setApplications] = useState([]);
        const [toasts, setToasts] = useState([]);
        
        // User Auth & Application State
        const [currentUser, setCurrentUser] = useState(() => {
          const local = localStorage.getItem("hootminer_current_user");
          return local ? JSON.parse(local) : null;
        });

        const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
        const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
        const [authTab, setAuthTab] = useState('login'); // 'login' | 'signup'
        const [loginEmail, setLoginEmail] = useState('');
        const [loginPassword, setLoginPassword] = useState('');
        const [loginError, setLoginError] = useState('');
        const [loginLoading, setLoginLoading] = useState(false);

        const [viewingTestKey, setViewingTestKey] = useState(null);
        const [applyContestModal, setApplyContestModal] = useState(null);

        // Contest Application Form State (Auto-filled if currentUser logged in)
        const [appForm, setAppForm] = useState({
          fullName: '',
          aadharNo: '',
          educationDegree: '1st yr',
          gender: 'Male',
          contactEmail: ''
        });

        const handleLoginSubmit = async (e) => {
          e.preventDefault();
          setLoginError('');
          setLoginLoading(true);

          if (!loginEmail.trim() || !loginPassword.trim()) {
            setLoginError('Please enter both email and password.');
            setLoginLoading(false);
            return;
          }

          if (window.HootDB) {
            const res = await window.HootDB.loginUserAccount(loginEmail, loginPassword);
            if (res.success) {
              setCurrentUser(res.user);
              setIsLoginModalOpen(false);
              setLoginEmail('');
              setLoginPassword('');
              addToast(`Welcome back, ${res.user.fullName}!`, 'success');
            } else {
              setLoginError(res.message);
            }
          }
          setLoginLoading(false);
        };

        const addToast = (message, type = 'info') => {
          const id = Date.now() + Math.random();
          setToasts((prev) => [...prev, { id, message, type }]);
        };

        const removeToast = (id) => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        };

        const loadData = async () => {
          if (window.HootDB) {
            await window.HootDB.seedInitialDataIfNeeded();
            const repos = await window.HootDB.fetchRepositories();
            const sfList = await window.HootDB.fetchSubfolders ? await window.HootDB.fetchSubfolders() : [];
            const qList = await window.HootDB.fetchQuestions();
            const cList = await window.HootDB.fetchContests();
            const aList = await window.HootDB.fetchContestApplications();
            setRepositories(repos);
            setSubfolders(sfList);
            setQuestions(qList);
            setContests(cList);
            setApplications(aList);
          }
        };

        const hasAutoOpenedExamRef = useRef(false);

        useEffect(() => {
          loadData();
          if (window.HootDB) {
            const unsub1 = window.HootDB.subscribeToRepositories((r) => setRepositories(r));
            const unsub2 = window.HootDB.subscribeToSubfolders ? window.HootDB.subscribeToSubfolders((sf) => setSubfolders(sf)) : null;
            const unsub3 = window.HootDB.subscribeToContests((c) => setContests(c));
            const unsub4 = window.HootDB.subscribeToApplications ? window.HootDB.subscribeToApplications((a) => setApplications(a)) : null;
            const unsub5 = window.HootDB.subscribeToQuestions ? window.HootDB.subscribeToQuestions((q) => setQuestions(q)) : null;
            return () => {
              if (typeof unsub1 === 'function') unsub1();
              if (typeof unsub2 === 'function') unsub2();
              if (typeof unsub3 === 'function') unsub3();
              if (typeof unsub4 === 'function') unsub4();
              if (typeof unsub5 === 'function') unsub5();
            };
          }
        }, []);

        // AUTO-OPEN SHARED EXAM IF URL PARAMETER examId IS PRESENT
        useEffect(() => {
          if (contests && contests.length > 0 && !hasAutoOpenedExamRef.current) {
            const urlParams = new URLSearchParams(window.location.search);
            const examId = urlParams.get('examId') || urlParams.get('exam') || urlParams.get('testId');
            if (examId) {
              const targetExam = contests.find(c => String(c.id) === String(examId) || String(c.id) === decodeURIComponent(examId));
              if (targetExam) {
                hasAutoOpenedExamRef.current = true;
                setActiveTab('home');
                setViewingTestKey(targetExam);
                addToast(`Opened shared live exam: "${targetExam.title}"`, 'info');
                setTimeout(() => {
                  const el = document.getElementById('live-tests');
                  if (el) el.scrollIntoView({ behavior: 'smooth' });
                }, 300);
              }
            }
          }
        }, [contests]);

        // Handle Apply Click on Contest Card
        const handleOpenApplyModal = (contest) => {
          setApplyContestModal(contest);
          if (currentUser) {
            // AUTO-FILL details if user is logged in
            setAppForm({
              fullName: currentUser.fullName || '',
              aadharNo: currentUser.aadharNo || '',
              educationDegree: currentUser.educationDegree || '1st yr',
              gender: currentUser.gender || 'Male',
              contactEmail: currentUser.contactEmail || ''
            });
          } else {
            // Prompt user login/register
            setAppForm({ fullName: '', aadharNo: '', educationDegree: '1st yr', gender: 'Male', contactEmail: '' });
          }
        };

        // Submit Contest Application
        const handleSubmitContestApp = async (e) => {
          e.preventDefault();
          if (!appForm.fullName || !appForm.aadharNo || !appForm.contactEmail) {
            addToast('Please fill out all required application fields.', 'error');
            return;
          }

          if (window.HootDB) {
            await window.HootDB.submitContestApplication({
              contestId: applyContestModal.id,
              contestTitle: applyContestModal.title,
              ...appForm
            });
            addToast(`Successfully applied to "${applyContestModal.title}"!`, 'success');
            setApplyContestModal(null);
          }
        };

        const handleLogout = () => {
          localStorage.removeItem("hootminer_current_user");
          setCurrentUser(null);
          setIsProfileModalOpen(false);
          addToast('Logged out successfully', 'info');
        };

        return (
          <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900 font-sans">
            <ToastContainer toasts={toasts} removeToast={removeToast} />
            
            <Navbar
              activeTab={activeTab}
              setActiveTab={setActiveTab}
              currentUser={currentUser}
              onOpenProfileModal={() => setIsProfileModalOpen(true)}
              onOpenLoginModal={() => setIsLoginModalOpen(true)}
            />
            
            <main className="flex-1">
              {activeTab === 'home' && (
                <>
                  <LandingHero
                    onLaunchWorkspace={() => setActiveTab('repos')}
                    onOpenLiveTests={() => {
                      const el = document.getElementById('live-tests');
                      if (el) el.scrollIntoView({ behavior: 'smooth' });
                    }}
                  />

                  {/* LIVE TESTS & EXAM ANSWER KEYS SECTION */}
                  <ContestsSection
                    contests={contests}
                    onViewAnswerKey={(test) => setViewingTestKey(test)}
                  />

                  <FeatureGrid />
                </>
              )}

              {activeTab === 'repos' && (
                <RepositoryHub
                  repositories={repositories}
                  subfolders={subfolders}
                  questions={questions}
                  onSelectRepo={(r) => { setSelectedRepo(r); setActiveTab('repo-detail'); }}
                />
              )}

              {activeTab === 'repo-detail' && selectedRepo && (
                <RepositoryDetailView
                  repo={selectedRepo}
                  subfolders={subfolders}
                  questions={questions}
                  onBack={() => setActiveTab('repos')}
                  addToast={addToast}
                />
              )}
            </main>

            <Footer />

            {/* USER PROFILE MODAL */}
            {isProfileModalOpen && currentUser && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                <div className="relative w-full max-w-md bg-white rounded-3xl p-6 border border-slate-200 shadow-2xl">
                  <div className="flex items-center justify-between pb-4 border-b border-slate-200 mb-4">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-2xl bg-purple-600 text-white font-black text-lg flex items-center justify-center">
                        {currentUser.fullName.charAt(0).toUpperCase()}
                      </div>
                      <div>
                        <h3 className="text-lg font-black text-slate-900">{currentUser.fullName}</h3>
                        <p className="text-xs text-purple-700 font-bold">{currentUser.contactEmail}</p>
                      </div>
                    </div>
                    <button onClick={() => setIsProfileModalOpen(false)} className="text-slate-400 hover:text-slate-700">
                      <Icon name="X" className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="space-y-3 text-xs font-semibold text-slate-700 mb-6">
                    <div className="p-3 rounded-2xl bg-slate-50 border flex justify-between">
                      <span className="text-slate-400">Adhar No:</span>
                      <span className="font-mono font-bold text-slate-900">{currentUser.aadharNo}</span>
                    </div>
                    <div className="p-3 rounded-2xl bg-slate-50 border flex justify-between">
                      <span className="text-slate-400">Education Degree:</span>
                      <span className="font-bold text-purple-700">{currentUser.educationDegree}</span>
                    </div>
                    <div className="p-3 rounded-2xl bg-slate-50 border flex justify-between">
                      <span className="text-slate-400">Gender:</span>
                      <span className="font-bold text-slate-900">{currentUser.gender}</span>
                    </div>
                  </div>

                  <button
                    onClick={handleLogout}
                    className="w-full py-3 px-4 rounded-2xl bg-rose-50 text-rose-600 border border-rose-200 text-xs font-extrabold hover:bg-rose-100 flex items-center justify-center gap-2 cursor-pointer"
                  >
                    <Icon name="LogOut" className="w-4 h-4" />
                    <span>Sign Out Account</span>
                  </button>
                </div>
              </div>
            )}

            {/* USER AUTHENTICATION MODAL (LOG IN / REGISTER TABS) */}
            {isLoginModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
                <div className="relative w-full max-w-md bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-2xl">
                  <button onClick={() => { setIsLoginModalOpen(false); setLoginError(''); }} className="absolute top-5 right-5 text-slate-400 hover:text-slate-700">
                    <Icon name="X" className="w-5 h-5" />
                  </button>

                  <div className="w-12 h-12 rounded-2xl bg-purple-100 text-purple-600 flex items-center justify-center mx-auto mb-4">
                    <Icon name="User" className="w-6 h-6" />
                  </div>

                  {/* Auth Mode Toggle Tabs */}
                  <div className="flex bg-slate-100 p-1.5 rounded-2xl mb-6 border border-slate-200">
                    <button
                      onClick={() => setAuthTab('login')}
                      className={`flex-1 py-2 rounded-xl text-xs font-extrabold transition-all cursor-pointer ${
                        authTab === 'login' ? 'bg-white text-purple-700 shadow-md' : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      Log In to Account
                    </button>
                    <button
                      onClick={() => setAuthTab('signup')}
                      className={`flex-1 py-2 rounded-xl text-xs font-extrabold transition-all cursor-pointer ${
                        authTab === 'signup' ? 'bg-white text-purple-700 shadow-md' : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      Create New Account
                    </button>
                  </div>

                  {authTab === 'login' ? (
                    /* LOG IN FORM */
                    <form onSubmit={handleLoginSubmit} className="space-y-4">
                      <div className="text-center mb-2">
                        <h3 className="text-xl font-black text-slate-900">Welcome Back</h3>
                        <p className="text-xs text-slate-500 font-medium">Enter your registered email and password to log in.</p>
                      </div>

                      {loginError && (
                        <div className="p-3 rounded-2xl bg-rose-50 border border-rose-200 text-xs font-bold text-rose-700 flex items-center gap-2">
                          <Icon name="Info" className="w-4 h-4 text-rose-600 shrink-0" />
                          <span>{loginError}</span>
                        </div>
                      )}

                      <div>
                        <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Contact Email *</label>
                        <input
                          type="email"
                          required
                          value={loginEmail}
                          onChange={(e) => setLoginEmail(e.target.value)}
                          placeholder="user@example.com"
                          className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-semibold text-slate-900 focus:outline-none focus:border-purple-500 shadow-sm"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Password *</label>
                        <input
                          type="password"
                          required
                          value={loginPassword}
                          onChange={(e) => setLoginPassword(e.target.value)}
                          placeholder="••••••••••••"
                          className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-semibold text-slate-900 focus:outline-none focus:border-purple-500 shadow-sm"
                        />
                      </div>

                      <button
                        type="submit"
                        disabled={loginLoading}
                        className="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-extrabold text-xs shadow-lg hover:shadow-purple-600/50 cursor-pointer mt-2"
                      >
                        {loginLoading ? 'Authenticating...' : 'Sign In & Log In'}
                      </button>
                    </form>
                  ) : (
                    /* CREATE NEW ACCOUNT LINK */
                    <div className="text-center py-2 space-y-4">
                      <h3 className="text-xl font-black text-slate-900">Create New Account</h3>
                      <p className="text-xs text-slate-500 font-medium leading-relaxed">
                        Register once with your Full Name, Adhar No, Education Degree, Gender, Contact Email, and set your Password.
                      </p>
                      <a
                        href="signup.html"
                        className="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-purple-600 via-pink-600 to-indigo-600 text-white font-extrabold text-xs shadow-lg block cursor-pointer"
                      >
                        Open Registration Form &rarr;
                      </a>
                    </div>
                  )}

                </div>
              </div>
            )}

            {/* CONTEST APPLICATION FORM MODAL (WITH AUTO-FILL) */}
            {applyContestModal && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                <div className="relative w-full max-w-md bg-white rounded-3xl p-6 border border-slate-200 shadow-2xl max-h-[90vh] overflow-y-auto">
                  <div className="flex items-center justify-between pb-4 border-b border-slate-200 mb-4">
                    <div>
                      <span className="text-[10px] font-extrabold uppercase text-purple-600">Contest Application</span>
                      <h3 className="text-lg font-black text-slate-900">{applyContestModal.title}</h3>
                    </div>
                    <button onClick={() => setApplyContestModal(null)} className="text-slate-400 hover:text-slate-700">
                      <Icon name="X" className="w-5 h-5" />
                    </button>
                  </div>

                  {currentUser ? (
                    <div className="mb-4 p-3 rounded-2xl bg-emerald-50 border border-emerald-200 text-xs font-bold text-emerald-800 flex items-center gap-2">
                      <Icon name="CheckCircle2" className="w-4 h-4 text-emerald-600 shrink-0" />
                      <span>Details Auto-filled from your Account!</span>
                    </div>
                  ) : (
                    <div className="mb-4 p-3 rounded-2xl bg-purple-50 border border-purple-200 text-xs font-medium text-purple-900 flex items-center justify-between">
                      <span>Not logged in?</span>
                      <a href="signup.html" className="font-extrabold text-purple-700 underline">Create Account</a>
                    </div>
                  )}

                  <form onSubmit={handleSubmitContestApp} className="space-y-4">
                    <div>
                      <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Full Name *</label>
                      <input
                        type="text"
                        required
                        value={appForm.fullName}
                        onChange={(e) => setAppForm({ ...appForm, fullName: e.target.value })}
                        placeholder="John Doe"
                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-semibold text-slate-900 focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Adhar No *</label>
                      <input
                        type="text"
                        required
                        value={appForm.aadharNo}
                        onChange={(e) => setAppForm({ ...appForm, aadharNo: e.target.value })}
                        placeholder="12-digit Adhar Number"
                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-semibold text-slate-900 focus:outline-none"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Education Degree *</label>
                        <select
                          value={appForm.educationDegree}
                          onChange={(e) => setAppForm({ ...appForm, educationDegree: e.target.value })}
                          className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-semibold text-slate-900 focus:outline-none"
                        >
                          <option value="1st yr">1st yr</option>
                          <option value="2nd yr">2nd yr</option>
                          <option value="3rd yr">3rd yr</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Gender *</label>
                        <select
                          value={appForm.gender}
                          onChange={(e) => setAppForm({ ...appForm, gender: e.target.value })}
                          className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-semibold text-slate-900 focus:outline-none"
                        >
                          <option value="Male">Male</option>
                          <option value="Female">Female</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">Contact Email *</label>
                      <input
                        type="email"
                        required
                        value={appForm.contactEmail}
                        onChange={(e) => setAppForm({ ...appForm, contactEmail: e.target.value })}
                        placeholder="user@example.com"
                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-semibold text-slate-900 focus:outline-none"
                      />
                    </div>

                    <div className="pt-4 border-t border-slate-200 flex items-center justify-end gap-3">
                      <button type="button" onClick={() => setApplyContestModal(null)} className="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                      <button type="submit" className="px-5 py-2.5 rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-xs font-extrabold shadow-md cursor-pointer">Submit Application</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* VIEW ANSWER KEY MODAL */}
            {viewingTestKey && (
              <ViewAnswerKeyModal
                test={viewingTestKey}
                onClose={() => setViewingTestKey(null)}
                addToast={addToast}
              />
            )}

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
